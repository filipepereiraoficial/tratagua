<style>
/* ============================================================ tokens ==== */
:root {
  color-scheme: light;
  /* Ground & ink — neutro morno, escolhido para acompanhar o petróleo */
  --papel:      #F7F5F1;
  --superficie: #FFFDFA;
  --elevado:    #FFFFFF;
  --fio:        #DFD9D0;
  --fio-forte:  #C3BBB0;
  --tinta:      #12262F;
  --tinta-2:    #47565E;
  --tinta-3:    #74828A;

  /* Institucional */
  --petroleo:   #0E2A38;
  --acento:     #16739B;
  --acento-sup: #E4EFF4;

  /* Séries (validadas: ΔE CVD ≥ 18) */
  --serie-a:    #16739B;
  --serie-b:    #CE6A16;
  --serie-c:    #7A4FA3;

  /* Faixas de aproveitamento — sempre acompanhadas de rótulo textual */
  --bom:        #1B7F5F;
  --bom-sup:    #E2F0EA;
  --medio:      #C08A00;
  --medio-sup:  #F7EEDA;
  --ruim:       #B3243C;
  --ruim-sup:   #F8E4E7;

  --grade:      rgba(18, 38, 47, .09);
  --sombra:     0 1px 2px rgba(14, 42, 56, .05), 0 6px 20px rgba(14, 42, 56, .05);

  --r:   8px;
  --r-s: 5px;
  --trilho: 236px;
  --topo: 58px;

  --display: Bitter, Georgia, "Times New Roman", serif;
  --ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}

:root:not([data-theme="light"]) { }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --papel:      #12181C;
    --superficie: #171F24;
    --elevado:    #1D262C;
    --fio:        #2B363D;
    --fio-forte:  #3D4A52;
    --tinta:      #E8EDEF;
    --tinta-2:    #A9B6BC;
    --tinta-3:    #7C8A92;
    --petroleo:   #0A1A22;
    --acento:     #4FA6CC;
    --acento-sup: #16303C;
    --serie-a:    #3D9CC4;
    --serie-b:    #C0741F;
    --serie-c:    #A47ACB;
    --bom:        #3FA684;
    --bom-sup:    #16302A;
    --medio:      #B0861B;
    --medio-sup:  #322A14;
    --ruim:       #DE5F76;
    --ruim-sup:   #37191F;
    --grade:      rgba(232, 237, 239, .10);
    --sombra:     0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --papel:      #12181C;
  --superficie: #171F24;
  --elevado:    #1D262C;
  --fio:        #2B363D;
  --fio-forte:  #3D4A52;
  --tinta:      #E8EDEF;
  --tinta-2:    #A9B6BC;
  --tinta-3:    #7C8A92;
  --petroleo:   #0A1A22;
  --acento:     #4FA6CC;
  --acento-sup: #16303C;
  --serie-a:    #3D9CC4;
  --serie-b:    #C0741F;
  --serie-c:    #A47ACB;
  --bom:        #3FA684;
  --bom-sup:    #16302A;
  --medio:      #B0861B;
  --medio-sup:  #322A14;
  --ruim:       #DE5F76;
  --ruim-sup:   #37191F;
  --grade:      rgba(232, 237, 239, .10);
  --sombra:     0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.28);
}

/* ============================================================== base ==== */
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--papel);
  color: var(--tinta);
  font-family: var(--ui);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: -.005em; }
h1 { font-size: 24px; line-height: 1.2; }
h2 { font-size: 16px; }
h3 { font-size: 14px; }
p { margin: 0 0 10px; }
a { color: var(--acento); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; border-radius: 3px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.num  { font-variant-numeric: tabular-nums; text-align: right; }
.mudo { color: var(--tinta-3); }
.rotulo {
  font-size: 10.5px; font-weight: 600; letter-spacing: .09em;
  text-transform: uppercase; color: var(--tinta-3);
}

/* ============================================================= casca ==== */
.app { display: grid; grid-template-columns: var(--trilho) minmax(0, 1fr); min-height: 100vh; }

.trilho {
  background: var(--petroleo);
  color: #C3D5DE;
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column;
  overflow-y: auto;
}
.marca { display: flex; gap: 10px; align-items: center; padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,.08); }
.marca__selo {
  width: 34px; height: 34px; flex: none; border-radius: 7px;
  background: var(--acento); color: #fff;
  display: grid; place-items: center;
  font-family: var(--display); font-weight: 700; font-size: 16px;
}
.marca__nome { color: #fff; font-family: var(--display); font-weight: 600; font-size: 14.5px; line-height: 1.15; }
.marca__sub { font-size: 11px; color: #7FA3B5; }

.trilho__grupo { padding: 14px 16px 5px; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: #5F8598; font-weight: 600; }
.trilho nav { display: flex; flex-direction: column; gap: 1px; padding: 0 8px; }
.item {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 10px; border-radius: var(--r-s);
  background: none; border: 0; width: 100%; text-align: left;
  color: #C3D5DE; font-size: 13.5px; cursor: pointer;
}
.item:hover { background: rgba(255,255,255,.07); color: #fff; }
.item[aria-current="page"] { background: var(--acento); color: #fff; font-weight: 500; }
.item__ic { width: 15px; flex: none; opacity: .9; }
.trilho__pe { margin-top: auto; padding: 14px 16px; font-size: 11px; color: #6C93A6; border-top: 1px solid rgba(255,255,255,.08); line-height: 1.45; }

.topo {
  position: sticky; top: 0; z-index: 20;
  height: var(--topo); display: flex; align-items: center; gap: 14px;
  padding: 0 20px; background: var(--superficie); border-bottom: 1px solid var(--fio);
}
.topo__ctx { font-size: 13px; color: var(--tinta-2); }
.topo__ctx strong { color: var(--tinta); font-weight: 600; }
.selo-demo {
  margin-left: auto; display: inline-flex; align-items: center; gap: 7px;
  padding: 4px 10px; border-radius: 999px;
  background: var(--acento-sup); color: var(--acento);
  font-size: 11.5px; font-weight: 600;
}
.selo-demo::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--acento); flex: none; }

.vista { padding: 20px; max-width: 1420px; }
.cabec { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; margin-bottom: 16px; }
.cabec p { margin: 3px 0 0; color: var(--tinta-2); font-size: 13px; max-width: 68ch; }
.cabec__acoes { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: var(--r-s);
  border: 1px solid var(--fio-forte); background: var(--elevado); color: var(--tinta);
  font-size: 13px; cursor: pointer;
}
.btn:hover { background: var(--acento-sup); border-color: var(--acento); color: var(--acento); }
.btn--forte { background: var(--acento); border-color: var(--acento); color: #fff; }
.btn--forte:hover { filter: brightness(1.08); color: #fff; }
.btn--min { padding: 3px 8px; font-size: 12px; }

/* ======================================================= indicadores ==== */
/* Um painel só, dividido por fios — não seis cartões soltos. */
/* Flex em vez de grid: os tiles da última linha crescem e preenchem a faixa,
   em vez de deixar células vazias emolduradas. */
.kpis {
  display: flex; flex-wrap: wrap;
  background: var(--superficie); border: 1px solid var(--fio); border-radius: var(--r);
  overflow: hidden; margin-bottom: 16px;
}
.kpi {
  flex: 1 1 168px; min-width: 0; padding: 12px 14px;
  border-right: 1px solid var(--fio); border-bottom: 1px solid var(--fio);
}
.kpi__v { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 25px; font-weight: 500; line-height: 1.1; margin-top: 3px; letter-spacing: -.02em; }
.kpi__n { font-size: 11.5px; color: var(--tinta-3); margin-top: 3px; line-height: 1.35; }
.kpi--bom .kpi__v { color: var(--bom); }
.kpi--medio .kpi__v { color: var(--medio); }
.kpi--ruim .kpi__v { color: var(--ruim); }
.kpi--acento .kpi__v { color: var(--acento); }

/* ============================================================ painel ==== */
.painel { background: var(--superficie); border: 1px solid var(--fio); border-radius: var(--r); margin-bottom: 16px; overflow: hidden; }
.painel__t { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--fio); flex-wrap: wrap; }
.painel__t h2 { font-size: 14.5px; }
.painel__t .direita { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.painel__c { padding: 14px; }
.painel__c--nu { padding: 0; }

.colunas { display: grid; gap: 16px; }
.c-2 { grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); }
.c-21 { grid-template-columns: minmax(0, 1.9fr) minmax(280px, 1fr); }
@media (max-width: 1080px) { .c-21 { grid-template-columns: 1fr; } }

/* ========================================================== tabelas ===== */
.rolagem { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 7px 12px; text-align: left; }
thead th {
  font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase;
  color: var(--tinta-3); font-weight: 600; white-space: nowrap;
  border-bottom: 1.5px solid var(--fio-forte);
}
tbody tr { border-bottom: 1px solid var(--fio); }
tbody tr:last-child { border-bottom: 0; }
tbody tr:hover { background: var(--acento-sup); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.linha-clicavel { cursor: pointer; }

/* ========================================================= etiquetas ==== */
.tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 1px 7px; border-radius: 4px;
  font-size: 11.5px; font-weight: 600; white-space: nowrap;
}
.tag--bom   { background: var(--bom-sup); color: var(--bom); }
.tag--medio { background: var(--medio-sup); color: var(--medio); }
.tag--ruim  { background: var(--ruim-sup); color: var(--ruim); }
.tag--info  { background: var(--acento-sup); color: var(--acento); }
.tag--neutro{ background: var(--papel); color: var(--tinta-2); border: 1px solid var(--fio); }

/* barra de aproveitamento dentro da tabela */
.barra { display: flex; align-items: center; gap: 8px; min-width: 132px; }
.barra__t { flex: 1; height: 6px; border-radius: 3px; background: var(--grade); overflow: hidden; }
.barra__p { height: 100%; border-radius: 3px; }
.barra__v { font-family: var(--mono); font-size: 12px; min-width: 44px; text-align: right; }

/* =========================================================== alertas ==== */
.alerta { display: flex; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--fio); }
.alerta:last-child { border-bottom: 0; }
.alerta__f { width: 3px; flex: none; border-radius: 2px; background: var(--tinta-3); }
.alerta--alta .alerta__f { background: var(--ruim); }
.alerta--media .alerta__f { background: var(--medio); }
.alerta--positiva .alerta__f { background: var(--bom); }
.alerta__t { font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.alerta__m { font-size: 12.5px; color: var(--tinta-2); margin-top: 1px; }

/* ========================================================== gráficos ==== */
.graf { position: relative; }
.graf svg { display: block; width: 100%; height: auto; overflow: visible; }
.graf text { font-family: var(--ui); fill: var(--tinta-3); }
.legenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--tinta-2); padding: 0 2px 8px; }
.legenda span { display: inline-flex; align-items: center; gap: 6px; }
.legenda i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.dica {
  position: absolute; pointer-events: none; z-index: 5;
  background: var(--petroleo); color: #fff; padding: 6px 9px; border-radius: var(--r-s);
  font-size: 12px; line-height: 1.4; box-shadow: var(--sombra); white-space: nowrap;
  opacity: 0; transform: translate(-50%, -108%); transition: opacity .1s;
}
.dica b { font-family: var(--mono); font-weight: 600; }
:root[data-theme="dark"] .dica, :root:not([data-theme="light"]) .dica { border: 1px solid var(--fio); }

/* =========================================== grade de resultados C/E/N == */
.grade-res { overflow: auto; max-height: 62vh; }
.grade-res table { border-collapse: separate; border-spacing: 0; font-size: 12px; }
.grade-res th, .grade-res td { border-bottom: 1px solid var(--fio); border-right: 1px solid var(--fio); padding: 4px 6px; }
.grade-res thead th { position: sticky; top: 0; z-index: 2; background: var(--superficie); }
.grade-res tbody th {
  position: sticky; left: 0; z-index: 1; background: var(--superficie);
  text-align: left; font-weight: 500; min-width: 176px; font-size: 12.5px;
}
.grade-res thead th:first-child { z-index: 3; }
.marcas { display: flex; gap: 2px; justify-content: center; }
.marcas button {
  width: 21px; height: 21px; border-radius: 4px; cursor: pointer;
  border: 1px solid var(--fio-forte); background: var(--elevado);
  color: var(--tinta-3); font-size: 10.5px; font-weight: 700; font-family: var(--mono);
  display: grid; place-items: center; padding: 0;
}
.marcas button:hover { border-color: var(--acento); color: var(--acento); }
.marcas button[aria-pressed="true"] { color: #fff; border-color: transparent; }
.marcas .c[aria-pressed="true"] { background: var(--bom); }
.marcas .e[aria-pressed="true"] { background: var(--ruim); }
.marcas .n[aria-pressed="true"] { background: var(--tinta-3); }

/* ===================================================== configurações ==== */
.campo { display: flex; flex-direction: column; gap: 4px; }
.campo label { font-size: 12px; font-weight: 600; color: var(--tinta-2); }
.campo input[type="number"] {
  width: 100%; padding: 6px 8px; border: 1px solid var(--fio-forte);
  border-radius: var(--r-s); background: var(--elevado); color: var(--tinta);
  font-family: var(--mono); font-size: 13px;
}
.grade-campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 12px; }

/* Régua de faixas — o controle que dá nome à tela */
.regua { padding: 6px 2px 2px; }
.regua__t {
  position: relative; height: 34px; border-radius: 6px; overflow: hidden;
  border: 1px solid var(--fio); display: flex;
}
.regua__f { display: grid; place-items: center; font-size: 11.5px; font-weight: 600; }
.regua__f--ruim  { background: var(--ruim-sup); color: var(--ruim); }
.regua__f--medio { background: var(--medio-sup); color: var(--medio); }
.regua__f--bom   { background: var(--bom-sup); color: var(--bom); }
.regua__marcas { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--tinta-3); margin-top: 3px; }
.regua__assuntos { display: flex; flex-direction: column; gap: 5px; margin-top: 14px; }
.regua__linha { display: grid; grid-template-columns: 168px 1fr 96px; gap: 10px; align-items: center; font-size: 12.5px; }
.regua__pista { height: 16px; border-radius: 4px; background: var(--grade); position: relative; overflow: hidden; }
.regua__valor { height: 100%; border-radius: 4px; }
input[type="range"] { width: 100%; accent-color: var(--acento); }

.aviso {
  display: flex; gap: 9px; padding: 10px 13px; border-radius: var(--r);
  background: var(--acento-sup); color: var(--tinta); font-size: 12.5px;
  border: 1px solid color-mix(in srgb, var(--acento) 30%, transparent);
  margin-bottom: 16px; line-height: 1.5;
}
.aviso b { color: var(--acento); }

.vazio { padding: 30px 16px; text-align: center; color: var(--tinta-3); font-size: 13px; }

.busca {
  padding: 5px 10px; border: 1px solid var(--fio-forte); border-radius: var(--r-s);
  background: var(--elevado); color: var(--tinta); font-size: 13px; width: 190px;
}

.migalha { background: none; border: 0; padding: 0; color: var(--acento); cursor: pointer; font-size: 13px; }
.migalha:hover { text-decoration: underline; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .trilho { position: static; height: auto; }
  .trilho nav { flex-direction: row; flex-wrap: wrap; }
  .item { width: auto; }
  .trilho__pe { display: none; }
  .vista { padding: 14px; }
  .c-21 { grid-template-columns: 1fr; }
}
</style>

<script>
"use strict";
const DADOS = JSON.parse(document.getElementById("dados").textContent);

/* ===========================================================================
   1. MOTOR ANALÍTICO
   Porte fiel de src/Services/{Analytics,Ranking,Alert}Service.php.
   Verificado no Node contra os valores calculados pelo PHP: ranking, médias,
   frequência, aproveitamento por assunto e as 21 mensagens de alerta batem.
   =========================================================================== */

const PADROES = {
  faixa_dominio: 80, faixa_intermediario: 60,
  peso_desempenho: 0.40, peso_evolucao: 0.25, peso_frequencia: 0.15, peso_consistencia: 0.20,
  id_evolucao: 75, id_atencao: 55,
  min_questoes_assunto: 3, min_avaliacoes_evolucao: 3, min_avaliacoes_indice: 2,
  janela_recente: 3, fator_evolucao: 5, fator_consistencia: 2,
  frequencia_minima: 75, media_alerta: 60, queda_alerta: 10, evolucao_alerta: 10,
  limite_dificuldade: 60, ocorrencias_persistente: 3, justificada_conta: false,
};

const r2 = (v) => v === null ? null : Math.round(v * 100) / 100;
const clamp = (v, min = 0, max = 100) => Math.max(min, Math.min(max, v));

function pesos(cfg) {
  const w = {
    desempenho: cfg.peso_desempenho, evolucao: cfg.peso_evolucao,
    frequencia: cfg.peso_frequencia, consistencia: cfg.peso_consistencia,
  };
  const soma = w.desempenho + w.evolucao + w.frequencia + w.consistencia;
  if (soma <= 0) return { desempenho: .4, evolucao: .25, frequencia: .15, consistencia: .2 };
  return {
    desempenho: w.desempenho / soma, evolucao: w.evolucao / soma,
    frequencia: w.frequencia / soma, consistencia: w.consistencia / soma,
  };
}

/** Média ponderada dos percentuais (peso = peso da avaliação). */
function mediaPonderada(notas) {
  let soma = 0, pesosTotal = 0;
  for (const n of notas) { soma += n.percentage * n.weight; pesosTotal += n.weight; }
  return pesosTotal > 0 ? r2(soma / pesosTotal) : null;
}

/** Coeficiente angular da reta de tendência: p.p. ganhos por avaliação. */
function tendencia(percentuais) {
  const n = percentuais.length;
  if (n < 2) return null;
  const mediaX = (n + 1) / 2;
  const mediaY = percentuais.reduce((a, b) => a + b, 0) / n;
  let num = 0, den = 0;
  percentuais.forEach((y, i) => { const dx = (i + 1) - mediaX; num += dx * (y - mediaY); den += dx * dx; });
  return den > 0 ? Math.round(num / den * 1000) / 1000 : null;
}

function desvioPadrao(valores) {
  const n = valores.length;
  if (n < 2) return null;
  const media = valores.reduce((a, b) => a + b, 0) / n;
  const variancia = valores.reduce((acc, v) => acc + (v - media) ** 2, 0) / n;
  return r2(Math.sqrt(variancia));
}

/** Média das últimas N avaliações menos a média das anteriores. */
function evolucaoRecente(percentuais, janela) {
  const n = percentuais.length;
  if (n < 2) return null;
  janela = Math.min(janela, Math.floor(n / 2)) || 1;
  const recentes = percentuais.slice(-janela);
  const anteriores = percentuais.slice(0, n - janela);
  if (anteriores.length === 0) return null;
  const m = (a) => a.reduce((x, y) => x + y, 0) / a.length;
  return r2(m(recentes) - m(anteriores));
}

function classificarConteudo(aproveitamento, cfg) {
  if (aproveitamento === null) return 'sem_dados';
  if (aproveitamento >= cfg.faixa_dominio) return 'dominio';
  if (aproveitamento >= cfg.faixa_intermediario) return 'intermediario';
  return 'dificuldade';
}

/* ------------------------------------------------------------------ base */

class Base {
  constructor(dados) {
    this.d = dados;
    this.topicoPorId = new Map(dados.topicos.map(t => [t.id, t]));
    this.questaoPorId = new Map(dados.questoes.map(q => [q.id, q]));
    this.avaliacaoPorId = new Map(dados.avaliacoes.map(a => [a.id, a]));
    this.alunoPorId = new Map(dados.alunos.map(a => [a.id, a]));
    this.aulaPorId = new Map(dados.aulas.map(l => [l.id, l]));
    // Avaliações em ordem cronológica — base de toda série temporal.
    this.avaliacoesOrdenadas = [...dados.avaliacoes].sort(
      (a, b) => a.assessment_date.localeCompare(b.assessment_date) || a.id - b.id
    );
  }

  /** Assunto raiz de um tópico (o tópico filho é consolidado no assunto pai). */
  raiz(topicId) {
    const t = this.topicoPorId.get(topicId);
    if (!t) return null;
    return t.parent_id ? this.topicoPorId.get(t.parent_id) : t;
  }

  notasDoAluno(studentId, filtros = {}) {
    return this.d.notas
      .filter(n => n.student_id === studentId)
      .map(n => ({ ...n, aval: this.avaliacaoPorId.get(n.assessment_id) }))
      .filter(n => n.aval && (!filtros.tipo || n.aval.type === filtros.tipo))
      .sort((a, b) => a.aval.assessment_date.localeCompare(b.aval.assessment_date) || a.aval.id - b.aval.id)
      .map(n => ({ ...n, weight: n.aval.weight }));
  }

  respostasDoAluno(studentId) {
    return this.d.respostas.filter(r => r.student_id === studentId);
  }

  /** Presença: faltas justificadas saem do denominador por padrão. */
  frequencia(studentId, cfg) {
    const regs = this.d.presencas.filter(p => p.student_id === studentId);
    const conta = (s) => regs.filter(p => p.status === s).length;
    const presentes = conta('presente'), atrasos = conta('atraso');
    const faltas = conta('falta'), justificadas = conta('falta_justificada');
    const total = regs.length;
    const base = cfg.justificada_conta ? total : total - justificadas;
    const participacoes = regs.map(p => p.participation).filter(v => v !== null && v !== undefined);
    return {
      aulas: total, presentes, atrasos, faltas, justificadas,
      frequencia: base > 0 ? r2((presentes + atrasos * 0.5) / base * 100) : null,
      participacao: participacoes.length ? r2(participacoes.reduce((a, b) => a + b, 0) / participacoes.length) : null,
    };
  }

  /** Acertos / erros / em branco de um recorte de respostas. */
  totaisDeResposta(respostas) {
    const total = respostas.length;
    const conta = (s) => respostas.filter(r => r.result === s).length;
    const acertos = conta('correta'), erros = conta('incorreta'), branco = conta('nao_respondida');
    return {
      total, acertos, erros, branco,
      pct_acertos: total ? r2(acertos / total * 100) : null,
      pct_erros: total ? r2(erros / total * 100) : null,
      pct_branco: total ? r2(branco / total * 100) : null,
    };
  }

  /**
   * Aproveitamento por assunto: pontos obtidos ÷ pontos possíveis, consolidado
   * no assunto raiz e classificado nas faixas configuradas.
   */
  aproveitamentoPorAssunto(respostas, cfg) {
    const grupos = new Map();
    for (const resp of respostas) {
      const q = this.questaoPorId.get(resp.question_id);
      if (!q || !q.topic_id) continue;
      const raiz = this.raiz(q.topic_id);
      if (!raiz) continue;
      if (!grupos.has(raiz.id)) {
        grupos.set(raiz.id, {
          topic_id: raiz.id, topic_name: raiz.name,
          respondidas: 0, acertos: 0, erros: 0, branco: 0,
          pontos_obtidos: 0, pontos_possiveis: 0, alunos: new Set(),
        });
      }
      const g = grupos.get(raiz.id);
      g.respondidas++;
      g.alunos.add(resp.student_id);
      if (resp.result === 'correta') g.acertos++;
      else if (resp.result === 'incorreta') g.erros++;
      else g.branco++;
      g.pontos_obtidos += resp.score_earned;
      g.pontos_possiveis += q.points;
    }

    return [...grupos.values()].map(g => {
      const aprov = g.pontos_possiveis > 0 ? r2(g.pontos_obtidos / g.pontos_possiveis * 100) : null;
      const amostra = g.respondidas >= cfg.min_questoes_assunto;
      return {
        ...g, alunos: g.alunos.size, aproveitamento: aprov,
        amostra_suficiente: amostra,
        classificacao: amostra ? classificarConteudo(aprov, cfg) : 'sem_dados',
      };
    }).sort((a, b) => (a.aproveitamento ?? 999) - (b.aproveitamento ?? 999));
  }

  /** Aproveitamento por nível de dificuldade das questões. */
  aproveitamentoPorDificuldade(respostas) {
    const ordem = ['facil', 'medio', 'dificil'];
    const grupos = new Map(ordem.map(d => [d, { dificuldade: d, respondidas: 0, acertos: 0, obtidos: 0, possiveis: 0 }]));
    for (const resp of respostas) {
      const q = this.questaoPorId.get(resp.question_id);
      if (!q) continue;
      const g = grupos.get(q.difficulty);
      g.respondidas++;
      if (resp.result === 'correta') g.acertos++;
      g.obtidos += resp.score_earned;
      g.possiveis += q.points;
    }
    return ordem.map(d => grupos.get(d)).filter(g => g.respondidas > 0).map(g => ({
      dificuldade: g.dificuldade, respondidas: g.respondidas, acertos: g.acertos,
      aproveitamento: g.possiveis > 0 ? r2(g.obtidos / g.possiveis * 100) : null,
    }));
  }

  /** Painel completo de um aluno — fonte única do dashboard individual. */
  resumoDoAluno(studentId, cfg) {
    const notas = this.notasDoAluno(studentId);
    const percentuais = notas.map(n => n.percentage);
    const media = mediaPonderada(notas);
    const slope = tendencia(percentuais);
    const delta = evolucaoRecente(percentuais, cfg.janela_recente);
    const desvio = desvioPadrao(percentuais);
    const presenca = this.frequencia(studentId, cfg);
    const respostas = this.respostasDoAluno(studentId);
    const assuntos = this.aproveitamentoPorAssunto(respostas, cfg);

    const conta = (c) => assuntos.filter(a => a.classificacao === c).length;

    const scoreEvolucao = (slope !== null && notas.length >= cfg.min_avaliacoes_evolucao)
      ? clamp(50 + slope * cfg.fator_evolucao) : 50;
    const scoreConsistencia = desvio !== null
      ? clamp(100 - desvio * cfg.fator_consistencia) : 50;

    const w = pesos(cfg);
    const confiavel = notas.length >= cfg.min_avaliacoes_indice;
    const indice = confiavel ? r2(
      w.desempenho * media + w.evolucao * scoreEvolucao +
      w.frequencia * (presenca.frequencia ?? 50) + w.consistencia * scoreConsistencia
    ) : null;

    const { classificacao, motivos } = classificarAluno(indice, delta, presenca.frequencia, confiavel, cfg);

    return {
      id: studentId, aluno: this.alunoPorId.get(studentId),
      avaliacoes: notas.length, notas, percentuais, media,
      evolucao_slope: slope,
      evolucao_total: slope !== null ? r2(slope * (notas.length - 1)) : null,
      evolucao_recente: delta, desvio,
      score_evolucao: r2(scoreEvolucao), score_consistencia: r2(scoreConsistencia),
      frequencia: presenca.frequencia, participacao: presenca.participacao, presenca,
      acertos: this.totaisDeResposta(respostas),
      assuntos,
      dominados: conta('dominio'), intermediarios: conta('intermediario'), dificuldades: conta('dificuldade'),
      indice, indice_confiavel: confiavel, classificacao, motivos,
      // Contribuição de cada componente para o índice — usada no gráfico do perfil.
      componentes: [
        { nome: 'Desempenho',   valor: media ?? 0,                 peso: w.desempenho },
        { nome: 'Evolução',     valor: scoreEvolucao,              peso: w.evolucao },
        { nome: 'Frequência',   valor: presenca.frequencia ?? 50,  peso: w.frequencia },
        { nome: 'Consistência', valor: scoreConsistencia,          peso: w.consistencia },
      ],
    };
  }

  /** Ranking pelo Índice de Desenvolvimento (não pela maior nota). */
  ranking(cfg) {
    const linhas = this.d.alunos
      .filter(a => a.status !== 'inativo')
      .map(a => this.resumoDoAluno(a.id, cfg));

    linhas.sort((x, y) => {
      if (x.indice === null && y.indice === null) return x.aluno.full_name.localeCompare(y.aluno.full_name);
      if (x.indice === null) return 1;
      if (y.indice === null) return -1;
      return y.indice - x.indice;
    });

    let posicao = 0;
    linhas.forEach(l => { l.posicao = l.indice === null ? null : ++posicao; });
    return linhas;
  }

  /** Médias e séries agregadas do recorte inteiro. */
  mediaGeral() {
    if (!this.d.notas.length) return null;
    return r2(this.d.notas.reduce((a, n) => a + n.percentage, 0) / this.d.notas.length);
  }

  mediaPorAvaliacao() {
    return this.avaliacoesOrdenadas.map(av => {
      const notas = this.d.notas.filter(n => n.assessment_id === av.id);
      const p = notas.map(n => n.percentage);
      return {
        assessment_id: av.id, nome: av.name, data: av.assessment_date, tipo: av.type,
        alunos: notas.length,
        media: p.length ? r2(p.reduce((a, b) => a + b, 0) / p.length) : null,
        minima: p.length ? Math.min(...p) : null,
        maxima: p.length ? Math.max(...p) : null,
      };
    });
  }

  distribuicao() {
    const faixas = { '0 a 39%': 0, '40 a 59%': 0, '60 a 79%': 0, '80 a 100%': 0 };
    for (const aluno of this.d.alunos) {
      const notas = this.d.notas.filter(n => n.student_id === aluno.id);
      if (!notas.length) continue;
      const m = notas.reduce((a, n) => a + n.percentage, 0) / notas.length;
      if (m < 40) faixas['0 a 39%']++;
      else if (m < 60) faixas['40 a 59%']++;
      else if (m < 80) faixas['60 a 79%']++;
      else faixas['80 a 100%']++;
    }
    return faixas;
  }

  /** Índice de acerto por questão de uma avaliação. */
  analiseDaAvaliacao(assessmentId, cfg) {
    const questoes = this.d.questoes
      .filter(q => q.assessment_id === assessmentId)
      .sort((a, b) => (a.number ?? a.id) - (b.number ?? b.id));

    return questoes.map(q => {
      const resp = this.d.respostas.filter(r => r.question_id === q.id);
      const acertos = resp.filter(r => r.result === 'correta').length;
      const indice = resp.length ? r2(acertos / resp.length * 100) : null;
      const raiz = q.topic_id ? this.raiz(q.topic_id) : null;
      return {
        ...q, assunto: raiz ? raiz.name : null,
        respondidas: resp.length, acertos,
        erros: resp.filter(r => r.result === 'incorreta').length,
        branco: resp.filter(r => r.result === 'nao_respondida').length,
        indice_acerto: indice, classificacao: classificarConteudo(indice, cfg),
      };
    });
  }
}

/** Classificação do aluno com a justificativa que o professor lê na tela. */
function classificarAluno(indice, delta, frequencia, confiavel, cfg) {
  if (!confiavel || indice === null) {
    return { classificacao: 'sem_dados', motivos: [`Menos de ${cfg.min_avaliacoes_indice} avaliação(ões) registrada(s).`] };
  }
  const motivos = [];
  let atencao = false;

  if (delta !== null && delta <= -cfg.queda_alerta) {
    atencao = true;
    motivos.push(`Queda de ${fmt(Math.abs(delta), 1)} p.p. no desempenho recente.`);
  }
  if (frequencia !== null && frequencia < cfg.frequencia_minima) {
    atencao = true;
    motivos.push(`Frequência de ${fmt(frequencia, 1)}%, abaixo do mínimo de ${fmt(cfg.frequencia_minima, 0)}%.`);
  }

  if (atencao || indice < cfg.id_atencao) {
    if (indice < cfg.id_atencao) motivos.push(`Índice de Desenvolvimento em ${fmt(indice, 1)}.`);
    return { classificacao: 'atencao', motivos };
  }
  if (indice >= cfg.id_evolucao) {
    motivos.push(`Índice de Desenvolvimento em ${fmt(indice, 1)}.`);
    if (delta !== null && delta > 0) motivos.push(`Ganho de ${fmt(delta, 1)} p.p. nas avaliações recentes.`);
    return { classificacao: 'evolucao', motivos };
  }
  motivos.push(`Índice de Desenvolvimento em ${fmt(indice, 1)}.`);
  return { classificacao: 'intermediario', motivos };
}

/** Número no formato pt-BR (vírgula decimal), como o PHP escreve nas mensagens. */
function fmt(valor, casas = 1) {
  return Number(valor).toLocaleString('pt-BR', { minimumFractionDigits: casas, maximumFractionDigits: casas });
}

/* ---------------------------------------------------------------- alertas */

function gerarAlertas(base, ranking, cfg) {
  const alertas = [];
  const novo = (chave, sev, titulo, alunoId, msg) =>
    alertas.push({ key: chave, severity: sev, title: titulo, student_id: alunoId, message: msg });

  for (const a of ranking) {
    const nome = a.aluno.full_name;

    if (a.evolucao_recente !== null && a.evolucao_recente <= -cfg.queda_alerta) {
      const janela = Math.min(cfg.janela_recente, Math.max(1, Math.floor(a.percentuais.length / 2)));
      const recentes = a.percentuais.slice(-janela);
      const anteriores = a.percentuais.slice(0, a.percentuais.length - janela);
      const m = (arr) => arr.length ? arr.reduce((x, y) => x + y, 0) / arr.length : 0;
      novo(`queda:${a.id}`, 'alta', 'Queda de desempenho', a.id,
        `${nome} teve queda de ${fmt(Math.abs(a.evolucao_recente))} pontos percentuais nas avaliações mais recentes (de ${fmt(m(anteriores))}% para ${fmt(m(recentes))}%).`);
    }

    if (a.frequencia !== null && a.frequencia < cfg.frequencia_minima && a.presenca.aulas > 0) {
      novo(`frequencia:${a.id}`, 'alta', 'Frequência baixa', a.id,
        `${nome} está com ${fmt(a.frequencia)}% de frequência (mínimo configurado: ${fmt(cfg.frequencia_minima, 0)}%), com ${a.presenca.faltas} falta(s) em ${a.presenca.aulas} aula(s).`);
    }

    if (a.media !== null && a.media < cfg.media_alerta && a.avaliacoes > 0) {
      novo(`media:${a.id}`, 'alta', 'Baixo aproveitamento', a.id,
        `${nome} está com média de ${fmt(a.media)}% em ${a.avaliacoes} avaliação(ões), abaixo do mínimo de ${fmt(cfg.media_alerta, 0)}%.`);
    }

    if (a.evolucao_recente !== null && a.evolucao_recente >= cfg.evolucao_alerta) {
      novo(`evolucao:${a.id}`, 'positiva', 'Evolução significativa', a.id,
        `${nome} evoluiu ${fmt(a.evolucao_recente)} pontos percentuais nas avaliações mais recentes. Vale registrar o reconhecimento.`);
    }

    if (a.avaliacoes === 0) {
      novo(`sem_avaliacao:${a.id}`, 'media', 'Aluno sem resultados', a.id,
        `${nome} está vinculado a uma turma mas ainda não possui nenhum resultado registrado.`);
    }
  }

  // Dificuldade persistente: mesmo assunto abaixo do limite em N avaliações.
  for (const a of ranking) {
    const porAssuntoAvaliacao = new Map();
    for (const resp of base.respostasDoAluno(a.id)) {
      const q = base.questaoPorId.get(resp.question_id);
      if (!q || !q.topic_id) continue;
      const raiz = base.raiz(q.topic_id);
      if (!raiz) continue;
      const chave = `${raiz.id}|${q.assessment_id}`;
      if (!porAssuntoAvaliacao.has(chave)) {
        porAssuntoAvaliacao.set(chave, { topico: raiz, obtidos: 0, possiveis: 0 });
      }
      const g = porAssuntoAvaliacao.get(chave);
      g.obtidos += resp.score_earned;
      g.possiveis += q.points;
    }
    const ocorrencias = new Map();
    for (const [chave, g] of porAssuntoAvaliacao) {
      if (g.possiveis <= 0) continue;
      const aprov = g.obtidos / g.possiveis * 100;
      if (aprov >= cfg.limite_dificuldade) continue;
      const id = chave.split('|')[0];
      if (!ocorrencias.has(id)) ocorrencias.set(id, { topico: g.topico, n: 0 });
      ocorrencias.get(id).n++;
    }
    for (const [id, o] of ocorrencias) {
      if (o.n < cfg.ocorrencias_persistente) continue;
      novo(`persistente:${a.id}:${id}`, 'alta', 'Dificuldade persistente', a.id,
        `Atenção: ${a.aluno.full_name} apresentou aproveitamento inferior a ${fmt(cfg.limite_dificuldade, 0)}% em ${o.topico.name} nas últimas ${o.n} avaliações.`);
    }
  }

  // Conteúdo crítico da turma.
  const assuntosTurma = base.aproveitamentoPorAssunto(base.d.respostas, cfg);
  for (const t of assuntosTurma) {
    if (t.aproveitamento === null || t.aproveitamento >= cfg.limite_dificuldade || t.respondidas < 5) continue;
    novo(`turma_conteudo:${t.topic_id}`, 'media', 'Conteúdo crítico da turma', null,
      `A turma ${base.d.turma.code} obteve apenas ${fmt(t.aproveitamento)}% de aproveitamento em ${t.topic_name} (${t.respondidas} respostas de ${t.alunos} aluno(s)). Conteúdo candidato a revisão.`);
  }

  const ordem = { alta: 0, media: 1, positiva: 2 };
  alertas.sort((x, y) => (ordem[x.severity] ?? 3) - (ordem[y.severity] ?? 3));
  return alertas;
}

let CFG = { ...PADROES };
let BASE = new Base(DADOS);
let M = null;                       // modelo derivado da rodada atual
let rota = { vista: "dashboard", id: null };

function recalcular() {
  BASE = new Base(DADOS);
  const ranking = BASE.ranking(CFG);
  M = {
    ranking,
    porAluno: new Map(ranking.map(r => [r.id, r])),
    alertas: gerarAlertas(BASE, ranking, CFG),
    assuntos: BASE.aproveitamentoPorAssunto(DADOS.respostas, CFG),
    dificuldade: BASE.aproveitamentoPorDificuldade(DADOS.respostas),
    porAvaliacao: BASE.mediaPorAvaliacao(),
    distribuicao: BASE.distribuicao(),
    mediaGeral: BASE.mediaGeral(),
    totais: BASE.totaisDeResposta(DADOS.respostas),
  };
  M.classes = { evolucao: 0, intermediario: 0, atencao: 0, sem_dados: 0 };
  ranking.forEach(r => M.classes[r.classificacao]++);
}

/** Recalcula a nota de um aluno numa avaliação — espelha Grade::recalculate. */
function recalcularNota(assessmentId, studentId) {
  const av = BASE.avaliacaoPorId.get(assessmentId);
  const qs = DADOS.questoes.filter(q => q.assessment_id === assessmentId);
  const ids = new Set(qs.map(q => q.id));
  const resp = DADOS.respostas.filter(r => r.student_id === studentId && ids.has(r.question_id));

  const idx = DADOS.notas.findIndex(n => n.assessment_id === assessmentId && n.student_id === studentId);
  if (!resp.length) { if (idx >= 0) DADOS.notas.splice(idx, 1); return; }

  let obtidos = 0, possiveis = 0, c = 0, e = 0, b = 0;
  for (const r of resp) {
    const q = qs.find(x => x.id === r.question_id);
    obtidos += r.score_earned; possiveis += q.points;
    if (r.result === "correta") c++; else if (r.result === "incorreta") e++; else b++;
  }
  const percentage = possiveis > 0 ? r2(obtidos / possiveis * 100) : 0;
  const nota = {
    assessment_id: assessmentId, student_id: studentId,
    score: r2(percentage / 100 * av.max_score), percentage,
    correct_count: c, wrong_count: e, blank_count: b,
  };
  if (idx >= 0) DADOS.notas[idx] = nota; else DADOS.notas.push(nota);
}

/* ===========================================================================
   3. UTILITÁRIOS DE APRESENTAÇÃO
   =========================================================================== */
const h = (v) => String(v ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (v, casas = 1) => v === null || v === undefined ? "—" : fmt(v, casas) + "%";
const num = (v, casas = 1) => v === null || v === undefined ? "—" : fmt(v, casas);
const dataBr = (iso) => iso ? iso.split("-").reverse().join("/") : "—";
const iniciais = (nome) => {
  const p = nome.trim().split(/\s+/);
  return ((p[0]?.[0] ?? "") + (p.length > 1 ? p[p.length - 1][0] : "")).toUpperCase();
};

/** Faixa visual de um aproveitamento — sempre exibida junto do número. */
function faixa(v) {
  if (v === null || v === undefined) return { classe: "neutro", cor: "var(--tinta-3)", texto: "Sem dados" };
  if (v >= CFG.faixa_dominio) return { classe: "bom", cor: "var(--bom)", texto: "Domínio" };
  if (v >= CFG.faixa_intermediario) return { classe: "medio", cor: "var(--medio)", texto: "Intermediário" };
  return { classe: "ruim", cor: "var(--ruim)", texto: "Dificuldade" };
}
const ROTULO_CLASSE = {
  evolucao: { texto: "Em evolução", classe: "bom" },
  intermediario: { texto: "Intermediário", classe: "medio" },
  atencao: { texto: "Precisa de atenção", classe: "ruim" },
  sem_dados: { texto: "Sem dados suficientes", classe: "neutro" },
};
const ROTULO_DIFICULDADE = { facil: "Fácil", medio: "Médio", dificil: "Difícil" };
const ROTULO_TIPO = {
  prova: "Prova", simulado: "Simulado", atividade: "Atividade",
  exercicio: "Exercício", diagnostica: "Avaliação diagnóstica", revisao: "Avaliação de revisão",
};
const ROTULO_PRESENCA = { presente: "Presente", falta: "Falta", falta_justificada: "Justificada", atraso: "Atraso" };

/** Barra de aproveitamento usada nas tabelas — cor + número, nunca só cor. */
function barra(v) {
  const f = faixa(v);
  return `<div class="barra">
    <span class="barra__t"><span class="barra__p" style="width:${Math.max(0, Math.min(100, v ?? 0))}%;background:${f.cor}"></span></span>
    <span class="barra__v">${pct(v, 0)}</span>
  </div>`;
}
const tag = (classe, texto) => `<span class="tag tag--${classe}">${h(texto)}</span>`;

/* ===========================================================================
   4. GRÁFICOS — SVG próprio, com camada de hover
   =========================================================================== */
/** Largura de desenho = largura real do container, para o SVG sair em escala
 *  1:1 e o texto continuar legível dentro de colunas estreitas. */
const cortar = (texto, max) => texto.length > max ? texto.slice(0, Math.max(3, max - 1)) + "…" : texto;

function larguraDe(alvo) {
  return Math.max(340, Math.round(alvo.clientWidth || 720));
}

const G = {
  L: 44, R: 18, T: 14, B: 30,        // margens do painel de plotagem
  cor: { a: "var(--serie-a)", b: "var(--serie-b)", c: "var(--serie-c)" },
};

/** Eixo Y de 0 a 100 com grade recessiva. */
function eixoY(w, h, max = 100, passo = 25, margemDireita = G.R) {
  let s = "";
  for (let v = 0; v <= max; v += passo) {
    const y = G.T + (h - G.T - G.B) * (1 - v / max);
    s += `<line x1="${G.L}" y1="${y}" x2="${w - margemDireita}" y2="${y}" stroke="var(--grade)" stroke-width="1"/>`;
    s += `<text x="${G.L - 8}" y="${y + 4}" text-anchor="end" font-size="11">${v}</text>`;
  }
  return s;
}

/**
 * Linha com 1..3 séries, marcadores, rótulo direto no fim de cada série
 * e cruz + balão no hover.
 */
function grafLinha(alvo, { labels, series, altura = 250 }) {
  if (!labels.length) { alvo.innerHTML = '<div class="vazio">Sem dados para este gráfico.</div>'; return; }
  const w = larguraDe(alvo), hh = altura;
  const margemDireita = series.length > 1 ? 74 : 22;   // espaço p/ o rótulo direto
  const pw = w - G.L - margemDireita, ph = hh - G.T - G.B;
  const x = (i) => labels.length === 1 ? G.L + pw / 2 : G.L + pw * i / (labels.length - 1);
  const y = (v) => G.T + ph * (1 - Math.max(0, Math.min(100, v)) / 100);

  let corpo = eixoY(w, hh, 100, 25, margemDireita);
  labels.forEach((l, i) => {
    corpo += `<text x="${x(i)}" y="${hh - G.B + 16}" text-anchor="middle" font-size="11">${h(l.length > 16 ? l.slice(0, 15) + "…" : l)}</text>`;
  });

  series.forEach((s, si) => {
    const cor = s.cor || [G.cor.a, G.cor.b, G.cor.c][si % 3];
    const pontos = s.dados.map((v, i) => v === null ? null : [x(i), y(v)]).filter(Boolean);
    if (pontos.length > 1) {
      corpo += `<polyline points="${pontos.map(p => p.join(",")).join(" ")}" fill="none"
        stroke="${cor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    }
    s.dados.forEach((v, i) => {
      if (v === null) return;
      corpo += `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${cor}" stroke="var(--superficie)" stroke-width="2"/>`;
    });
    // Rótulo direto no último ponto — identidade sem depender só da cor.
    const ult = s.dados.map((v, i) => [v, i]).filter(([v]) => v !== null).pop();
    if (ult && series.length > 1) {
      corpo += `<text x="${x(ult[1]) + 8}" y="${y(ult[0]) + 4}" font-size="11.5" font-weight="600" fill="${cor}">${h(s.nome)}</text>`;
    }
  });

  const legenda = series.length > 1
    ? `<div class="legenda">${series.map((s, i) =>
        `<span><i style="background:${s.cor || [G.cor.a, G.cor.b, G.cor.c][i % 3]}"></i>${h(s.nome)}</span>`).join("")}</div>`
    : "";

  alvo.innerHTML = `${legenda}<div class="graf">
    <svg viewBox="0 0 ${w} ${hh}" role="img" aria-label="${h(series.map(s => s.nome).join(", "))}">
      ${corpo}
      <line id="cruz" x1="0" y1="${G.T}" x2="0" y2="${hh - G.B}" stroke="var(--fio-forte)" stroke-width="1" opacity="0"/>
    </svg>
    <div class="dica"></div>
  </div>`;

  ligarHover(alvo.querySelector(".graf"), labels, series, w, hh, x, y);
}

function ligarHover(graf, labels, series, w, hh, x, y) {
  const svg = graf.querySelector("svg"), dica = graf.querySelector(".dica"), cruz = graf.querySelector("#cruz");
  graf.addEventListener("pointermove", (ev) => {
    const r = svg.getBoundingClientRect();
    const vx = (ev.clientX - r.left) / r.width * w;
    let melhor = 0, dist = Infinity;
    labels.forEach((_, i) => { const d = Math.abs(x(i) - vx); if (d < dist) { dist = d; melhor = i; } });
    cruz.setAttribute("x1", x(melhor)); cruz.setAttribute("x2", x(melhor));
    cruz.setAttribute("opacity", "1");
    dica.innerHTML = `${h(labels[melhor])}<br>` + series.map((s, si) => {
      const v = s.dados[melhor];
      const cor = s.cor || [G.cor.a, G.cor.b, G.cor.c][si % 3];
      return `<span style="color:${cor}">■</span> ${h(s.nome)}: <b>${v === null ? "—" : fmt(v, 1) + "%"}</b>`;
    }).join("<br>");
    const alturas = series.map(s => s.dados[melhor]).filter(v => v !== null);
    const yv = alturas.length ? y(Math.max(...alturas)) : G.T;
    dica.style.left = (x(melhor) / w * r.width) + "px";
    dica.style.top = (yv / hh * r.height) + "px";
    dica.style.opacity = "1";
  });
  graf.addEventListener("pointerleave", () => { dica.style.opacity = "0"; cruz.setAttribute("opacity", "0"); });
}

/** Barras horizontais — nome à esquerda, valor rotulado no fim da barra. */
function grafBarrasH(alvo, itens, { rotuloLargura = 190, max = 100, unidade = "%" } = {}) {
  if (!itens.length) { alvo.innerHTML = '<div class="vazio">Sem dados para este gráfico.</div>'; return; }
  const w = larguraDe(alvo), alturaLinha = 27, hh = itens.length * alturaLinha + 22;
  const x0 = Math.min(rotuloLargura, Math.round(w * 0.42));
  const pw = w - x0 - 62;
  let corpo = "";

  itens.forEach((it, i) => {
    const yTopo = i * alturaLinha + 8;
    const v = Math.max(0, Math.min(max, it.valor ?? 0));
    const larg = pw * v / max;
    const cor = it.cor || faixa(it.valor).cor;
    corpo += `<text x="${x0 - 10}" y="${yTopo + 13}" text-anchor="end" font-size="12" fill="var(--tinta-2)">${h(cortar(it.nome, Math.floor(x0 / 6.6)))}</text>`;
    corpo += `<rect x="${x0}" y="${yTopo + 3}" width="${pw}" height="13" rx="3" fill="var(--grade)"/>`;
    if (it.valor !== null) {
      corpo += `<rect x="${x0}" y="${yTopo + 3}" width="${Math.max(3, larg)}" height="13" rx="3" fill="${cor}"><title>${h(it.nome)}: ${fmt(it.valor, 1)}${unidade}</title></rect>`;
    }
    corpo += `<text x="${x0 + Math.max(3, larg) + 8}" y="${yTopo + 14}" font-size="11.5" font-family="var(--mono)" fill="var(--tinta-2)">${it.valor === null ? "—" : fmt(it.valor, 1) + unidade}</text>`;
    if (it.nota) corpo += `<text x="${x0 - 10}" y="${yTopo + 24}" text-anchor="end" font-size="10" fill="var(--tinta-3)">${h(it.nota)}</text>`;
  });

  alvo.innerHTML = `<div class="graf"><svg viewBox="0 0 ${w} ${hh}" role="img" aria-label="Barras de aproveitamento">${corpo}</svg></div>`;
}

/** Barras verticais agrupadas, com 2px de respiro entre barras vizinhas. */
function grafBarrasV(alvo, { labels, series, altura = 250, max = 100, passo = 25, unidade = "%", casas = 1 }) {
  if (!labels.length) { alvo.innerHTML = '<div class="vazio">Sem dados para este gráfico.</div>'; return; }
  const w = larguraDe(alvo), hh = altura, pw = w - G.L - G.R, ph = hh - G.T - G.B;
  const largGrupo = Math.min(64, (pw / labels.length) * 0.66);
  const largBarra = (largGrupo - (series.length - 1) * 2) / series.length;
  let corpo = eixoY(w, hh, max, passo);
  const largura = pw / labels.length;

  labels.forEach((l, i) => {
    const cx = G.L + largura * (i + 0.5);
    series.forEach((s, si) => {
      const v = s.dados[i];
      if (v === null || v === undefined) return;
      const alt = ph * Math.max(0, Math.min(max, v)) / max;
      const bx = cx - largGrupo / 2 + si * (largBarra + 2);
      const cor = s.cores ? s.cores[i] : (s.cor || [G.cor.a, G.cor.b, G.cor.c][si % 3]);
      corpo += `<rect x="${bx}" y="${G.T + ph - alt}" width="${largBarra}" height="${Math.max(2, alt)}" rx="4"
        fill="${cor}"><title>${h(l)} · ${h(s.nome)}: ${fmt(v, casas)}${unidade}</title></rect>`;
    });
    corpo += `<text x="${cx}" y="${hh - G.B + 16}" text-anchor="middle" font-size="11">${h(l.length > 14 ? l.slice(0, 13) + "…" : l)}</text>`;
  });

  const legenda = series.length > 1
    ? `<div class="legenda">${series.map((s, i) => `<span><i style="background:${s.cor || [G.cor.a, G.cor.b, G.cor.c][i % 3]}"></i>${h(s.nome)}</span>`).join("")}</div>`
    : "";
  alvo.innerHTML = `${legenda}<div class="graf"><svg viewBox="0 0 ${w} ${hh}" role="img" aria-label="${h(series.map(s => s.nome).join(", "))}">${corpo}</svg></div>`;
}

/**
 * Contribuição de cada componente para o Índice de Desenvolvimento.
 * Uma barra empilhada que soma exatamente o índice — o gráfico é a fórmula.
 */
function grafContribuicao(alvo, resumo) {
  if (resumo.indice === null) { alvo.innerHTML = '<div class="vazio">Índice indisponível: avaliações insuficientes.</div>'; return; }
  const w = larguraDe(alvo), hh = 96, x0 = 8, pw = w - 74;
  const cores = [G.cor.a, G.cor.b, G.cor.c, "var(--bom)"];
  let x = x0, corpo = "", legenda = "";

  resumo.componentes.forEach((c, i) => {
    const contrib = c.valor * c.peso;
    const larg = pw * contrib / 100;
    corpo += `<rect x="${x}" y="18" width="${Math.max(0, larg - 2)}" height="30" rx="3" fill="${cores[i]}">
      <title>${h(c.nome)}: ${fmt(c.valor, 1)} × ${fmt(c.peso * 100, 0)}% = ${fmt(contrib, 1)} pontos do índice</title></rect>`;
    if (larg > 46) {
      corpo += `<text x="${x + larg / 2 - 1}" y="${38}" text-anchor="middle" font-size="12" font-weight="600" fill="#fff" font-family="var(--mono)">${fmt(contrib, 1)}</text>`;
    }
    legenda += `<span><i style="background:${cores[i]}"></i>${h(c.nome)} ${fmt(c.valor, 1)} × ${fmt(c.peso * 100, 0)}%</span>`;
    x += larg;
  });

  // Marcas dos cortes de classificação, para situar o índice na escala.
  [[CFG.id_atencao, "atenção"], [CFG.id_evolucao, "evolução"]].forEach(([v, rot]) => {
    const px = x0 + pw * v / 100;
    corpo += `<line x1="${px}" y1="12" x2="${px}" y2="54" stroke="var(--tinta-3)" stroke-width="1" stroke-dasharray="3 3"/>`;
    corpo += `<text x="${px}" y="68" text-anchor="middle" font-size="10.5" fill="var(--tinta-3)">corte ${h(rot)} ${fmt(v, 0)}</text>`;
  });
  corpo += `<text x="${x0}" y="12" font-size="11" fill="var(--tinta-3)">0</text>`;
  corpo += `<text x="${x0 + pw}" y="12" text-anchor="end" font-size="11" fill="var(--tinta-3)">100</text>`;
  corpo += `<text x="${Math.min(x + 8, w - 60)}" y="${38}" font-size="13" font-weight="700" font-family="var(--mono)" fill="var(--tinta)">= ${fmt(resumo.indice, 1)}</text>`;

  alvo.innerHTML = `<div class="legenda">${legenda}</div>
    <div class="graf"><svg viewBox="0 0 ${w} ${hh}" role="img" aria-label="Composição do Índice de Desenvolvimento">${corpo}</svg></div>`;
}
</script>

}
