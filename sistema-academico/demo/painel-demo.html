                    <span class="tag tag--medio">${M.alertas.filter(a => a.severity === "media").length} média</span>
                    <span class="tag tag--bom">${M.alertas.filter(a => a.severity === "positiva").length} positiva</span>` })}
        ${painel("Índice de Desenvolvimento", tabela(
          [{ t: "#", num: 1 }, { t: "Aluno" }, { t: "Média", num: 1 }, { t: "Índice", num: 1 }, { t: "Situação" }],
          M.ranking.map(r => {
            const c = CLASSE_ALUNO[r.classificacao];
            return `<tr class="linha-clicavel" data-aluno="${r.id}">
              <td class="num mono">${r.posicao ?? "—"}</td><td>${h(r.aluno.full_name)}</td>
              <td class="num">${pct(r.media, 0)}</td><td class="num mono"><strong>${num(r.indice)}</strong></td>
              <td>${tag(c.classe, c.texto)}</td></tr>`;

    grafBarrasV(el("db-dist"), { labels: Object.keys(M.distribuicao), altura: 220,
      max: Math.max(1, M.ranking.length), passo: 1, unidade: " aluno(s)", casas: 0,
      series: [{ nome: "Alunos", dados: Object.values(M.distribuicao),

    grafBarrasH(el("db-dif"), M.dificuldade.map(x => ({ nome: DIFICULDADE[x.dificuldade], valor: x.aproveitamento,

/* ------------------------------- dashboard individual (admin e professor) */
function vistaAluno(rotaVolta) {
  const r = M.porAluno.get(rota.id) || BASE.resumoDoAluno(rota.id, CFG, escopo());
  if (!r || !r.aluno) return { html: '<div class="vazio">Aluno não encontrado.</div>' };

  const c = CLASSE_ALUNO[r.classificacao];
  const fTurma = { ...escopo(), turma: r.aluno.class_id };
  const mediaTurma = BASE.mediaGeral(fTurma);
  const serieTurma = BASE.mediaPorAvaliacao(fTurma);
  const mapaTurma = new Map(serieTurma.map(a => [a.assessment_id, a.media]));
  const labels = r.notas.map(n => n.aval.name);
  const alertasDele = M.alertas.filter(a => a.student_id === r.id);
  const perda = M.perdaAluno.find(p => p.student_id === r.id);
  const delta = (r.media !== null && mediaTurma !== null) ? r.media - mediaTurma : null;
  const acomp = DADOS.acompanhamentos.filter(i => i.student_id === r.id);
  const porDisciplina = (() => {
    const grupos = new Map();
    r.notas.forEach(n => {
      const d = BASE.disciplinaDaOferta(n.aval.class_subject_id);
      if (!grupos.has(d.id)) grupos.set(d.id, { nome: d.name, valores: [] });
      grupos.get(d.id).valores.push(n.percentage);
    });
    return [...grupos.values()].map(g => ({ nome: g.nome,
      media: r2(g.valores.reduce((a, b) => a + b, 0) / g.valores.length) }));
  })();

  return {
    html: `
      <div class="cabec">
        <div style="display:flex;gap:12px;align-items:center">
          <span style="width:44px;height:44px;border-radius:50%;background:var(--acento-sup);color:var(--acento);
                       display:grid;place-items:center;font-weight:600;font-family:var(--display)">${h(iniciais(r.aluno.full_name))}</span>
          <div>
            <h1>${h(r.aluno.full_name)}</h1>
            <p><button class="migalha" data-ir="${rotaVolta}">${rotaVolta === "alunos" ? "Alunos" : "Meu painel"}</button>
              · ${h(r.turma ? r.turma.code : "sem turma")} · ${tag(c.classe, c.texto)}
              ${r.posicao ? " · posição " + r.posicao + " de " + M.ranking.filter(x => x.indice !== null).length : ""}</p>
          </div>
        </div>
        <div class="cabec__acoes">
          <button class="btn" data-acompanhar="${r.id}" data-titulo="Acompanhamento de ${h(r.aluno.full_name)}">Registrar acompanhamento</button>
        </div>
      </div>

      ${r.motivos.length ? `<div class="aviso"><b>Por quê?</b><div>${h(r.motivos.join(" "))}</div></div>` : ""}

      <div class="kpis">
        ${kpi("Média", pct(r.media), delta === null ? "" :
          `${delta >= 0 ? "▲" : "▼"} ${num(Math.abs(delta))} p.p. vs. turma (${pct(mediaTurma, 0)})`, faixa(r.media).classe)}
        ${kpi("% de acertos", pct(r.acertos.pct_acertos), `${r.acertos.acertos} de ${r.acertos.total} questões`, faixa(r.acertos.pct_acertos).classe)}
        ${kpi("% de erros", pct(r.acertos.pct_erros), `${r.acertos.branco} em branco`)}
        ${kpi("Avaliações", r.avaliacoes, `desvio de ${num(r.desvio)} p.p.`)}
        ${kpi("Evolução recente", r.evolucao_recente === null ? "—" : (r.evolucao_recente >= 0 ? "+" : "") + num(r.evolucao_recente),
          `tendência ${num(r.evolucao_slope, 2)} p.p./aval.`, r.evolucao_recente === null ? "" : (r.evolucao_recente >= 0 ? "bom" : "ruim"))}
        ${kpi("Frequência", pct(r.frequencia), `${r.presenca.faltas} falta(s) em ${r.presenca.aulas} aula(s)`,
          r.frequencia === null ? "" : (r.frequencia >= CFG.frequencia_minima ? "bom" : "ruim"))}
        ${kpi("Pontos deixados na prova", perda ? num(perda.perdidos, 1) : "—",
          perda ? "pior em " + h(perda.pior_avaliacao ?? "—") : "", "medio")}
        ${kpi("Conteúdos dominados", r.dominados, `${r.dificuldades} com dificuldade`, "bom")}
        ${kpi("Índice de Desenvolvimento", num(r.indice), c.texto, "acento")}
      </div>

      ${painel("Como o Índice deste aluno foi formado", grafico("al-contrib", 110),
        { direita: '<span class="tag tag--neutro">cada faixa é componente × peso</span>' })}

      <div class="colunas c-2">
        ${painel("Evolução das notas", grafico("al-ev"), { direita: '<span class="tag tag--info">aluno × turma</span>' })}
        ${painel("Acertos e erros por avaliação", grafico("al-ae"))}
      </div>
      <div class="colunas c-2">
        ${painel("Desempenho por assunto", grafico("al-as", 200))}
        ${painel("Por disciplina e por dificuldade", grafico("al-dd", 170))}
      </div>

      <div class="colunas c-21">
        <div>
          ${painel("Mapa de conteúdos", tabela(
            [{ t: "Assunto" }, { t: "Disciplina" }, { t: "Questões", num: 1 }, { t: "Aproveitamento" }, { t: "Situação" }],
            r.assuntos.map(a => {
              const f = faixa(a.amostra_suficiente ? a.aproveitamento : null);
              return `<tr><td>${h(a.topic_name)}</td><td class="mudo">${h(a.subject_name)}</td>
                <td class="num">${a.respondidas}</td><td>${barra(a.aproveitamento)}</td>
                <td>${tag(f.classe, a.amostra_suficiente ? f.texto : "Amostra insuficiente")}</td></tr>`;
            }), { vazio: "Nenhuma resposta por questão registrada." }), { nu: true })}

          ${painel("Histórico de avaliações", tabela(
            [{ t: "Data" }, { t: "Avaliação" }, { t: "Disciplina" }, { t: "Nota", num: 1 }, { t: "%", num: 1 }, { t: "C/E/B", num: 1 }],
            [...r.notas].reverse().map(n => `<tr class="linha-clicavel" data-avaliacao="${n.assessment_id}">
              <td class="mono nowrap">${dataBr(n.aval.assessment_date)}</td><td>${h(n.aval.name)}</td>
              <td class="mudo">${h(BASE.disciplinaDaOferta(n.aval.class_subject_id).name)}</td>
              <td class="num mono">${num(n.score, 2)} / ${num(n.aval.max_score, 0)}</td>
              <td class="num">${tag(faixa(n.percentage).classe, pct(n.percentage, 0))}</td>
              <td class="num mono">${n.correct_count}/${n.wrong_count}/${n.blank_count}</td></tr>`)), { nu: true })}
        </div>
        <div>
          ${painel("Alertas deste aluno", listaAlertas(alertasDele, 99, true), { nu: true })}
          ${painel("Acompanhamentos", acomp.length === 0
            ? '<div class="vazio">Nenhum registro para este aluno.</div>'
            : `<div class="rolagem"><table><tbody>${acomp.map(i => `
                <tr><td>${h(i.title)}<div class="mudo" style="font-size:11.5px">${h(TIPO_ACOMP[i.type])} · ${dataBr(i.created_at)}</div></td>
                  <td class="num">${tag(i.status === "concluida" ? "bom" : i.status === "cancelada" ? "neutro" : "medio", STATUS_ACOMP[i.status])}</td></tr>`).join("")}</tbody></table></div>`,
            { nu: true })}
          ${painel("Presença", tabela(
            [{ t: "Data" }, { t: "Aula" }, { t: "Situação" }],
            BASE.presencas({ ...escopo(), aluno: r.id }).map(p => {
              const aula = BASE.aulaPorId.get(p.lesson_id);
              const cl = { presente: "bom", atraso: "medio", falta: "ruim", falta_justificada: "neutro" }[p.status];
              return `<tr><td class="mono">${dataBr(aula.lesson_date)}</td>
                <td style="font-size:12px">${h(cortar(aula.title, 34))}</td>
                <td>${tag(cl, PRESENCA[p.status])}</td></tr>`;
            })), { nu: true })}
        </div>
      </div>`,
    depois() {
      grafContribuicao(el("al-contrib"), r);
      grafLinha(el("al-ev"), { labels, series: [
        { nome: r.aluno.full_name.split(" ")[0], dados: r.percentuais },
        { nome: "Turma", dados: r.notas.map(n => mapaTurma.get(n.assessment_id) ?? null), cor: "var(--serie-c)" }] });
      grafBarrasV(el("al-ae"), { labels, series: [
        { nome: "% de acertos", dados: r.notas.map(n => { const t = n.correct_count + n.wrong_count + n.blank_count; return t ? r2(n.correct_count / t * 100) : null; }), cor: "var(--bom)" },
        { nome: "% de erros", dados: r.notas.map(n => { const t = n.correct_count + n.wrong_count + n.blank_count; return t ? r2(n.wrong_count / t * 100) : null; }), cor: "var(--ruim)" }] });
      grafBarrasH(el("al-as"), r.assuntos.map(a => ({ nome: a.topic_name, valor: a.aproveitamento, nota: a.subject_name })));
      const dif = BASE.aproveitamentoPorDificuldade(BASE.respostas({ ...escopo(), aluno: r.id }));
      grafBarrasH(el("al-dd"), [
        ...porDisciplina.map(d => ({ nome: d.nome, valor: d.media })),
        ...dif.map(d => ({ nome: DIFICULDADE[d.dificuldade], valor: d.aproveitamento, cor: "var(--serie-c)" })),
      ]);
    },
  };
}
VISTAS.aluno = () => vistaAluno("alunos");
VISTAS["aluno-professor"] = () => vistaAluno("meu-painel");

/* ------------------------------------------------------ painel do aluno */
VISTAS["minha-evolucao"] = () => {
  const r = BASE.resumoDoAluno(PERFIL.studentId, CFG, {});
  const fTurma = { turma: r.aluno.class_id };
  const mediaTurma = BASE.mediaGeral(fTurma);
  const mapaTurma = new Map(BASE.mediaPorAvaliacao(fTurma).map(a => [a.assessment_id, a.media]));
  const labels = r.notas.map(n => n.aval.name);
  const dificeis = r.assuntos.filter(a => a.classificacao === "dificuldade");
  const bons = r.assuntos.filter(a => a.classificacao === "dominio");
  const delta = (r.media !== null && mediaTurma !== null) ? r.media - mediaTurma : null;

  return {
    html: `
      <div class="cabec">
        <div><h1>Minha evolução</h1>
          <p>${h(r.aluno.full_name)}${r.turma ? " · turma " + h(r.turma.code) : ""}</p></div>
      </div>
      ${avisoEscopo()}

      <div class="kpis">
        ${kpi("Minha média", pct(r.media), delta === null ? "" :
          `${delta >= 0 ? "acima" : "abaixo"} da turma em ${num(Math.abs(delta))} p.p.`, faixa(r.media).classe)}
        ${kpi("Acertos", pct(r.acertos.pct_acertos), `${r.acertos.acertos} de ${r.acertos.total} questões`, faixa(r.acertos.pct_acertos).classe)}
        ${kpi("Minha evolução", r.evolucao_recente === null ? "—" : (r.evolucao_recente >= 0 ? "+" : "") + num(r.evolucao_recente),
          "pontos percentuais recentes", r.evolucao_recente === null ? "" : (r.evolucao_recente >= 0 ? "bom" : "ruim"))}
        ${kpi("Frequência", pct(r.frequencia), `${r.presenca.faltas} falta(s) em ${r.presenca.aulas} aula(s)`,
          r.frequencia >= CFG.frequencia_minima ? "bom" : "ruim")}
        ${kpi("Conteúdos que domino", r.dominados, `${r.intermediarios} em construção`, "bom")}
        ${kpi("Para reforçar", r.dificuldades, `abaixo de ${num(CFG.faixa_intermediario, 0)}%`, "ruim")}
      </div>

      <div class="colunas c-2">
        ${painel("Minhas notas ao longo do tempo", grafico("me-ev"), { direita: '<span class="tag tag--info">eu × turma</span>' })}
        ${painel("Meu desempenho por assunto", grafico("me-as", 200))}
      </div>

      <div class="colunas c-2">
        ${painel("O que reforçar", dificeis.length === 0
          ? '<div class="vazio">Nenhum conteúdo abaixo da faixa de dificuldade. Bom trabalho.</div>'
          : `<div class="rolagem"><table><tbody>${dificeis.map(a => `
              <tr><td>${h(a.topic_name)}<div class="mudo" style="font-size:11.5px">${h(a.subject_name)}</div></td>
                <td style="width:150px">${barra(a.aproveitamento)}</td></tr>`).join("")}</tbody></table></div>`, { nu: true })}
        ${painel("O que já domino", bons.length === 0
          ? '<div class="vazio">Ainda não há conteúdo na faixa de domínio.</div>'
          : `<div class="rolagem"><table><tbody>${bons.map(a => `
              <tr><td>${h(a.topic_name)}<div class="mudo" style="font-size:11.5px">${h(a.subject_name)}</div></td>
                <td style="width:150px">${barra(a.aproveitamento)}</td></tr>`).join("")}</tbody></table></div>`, { nu: true })}
      </div>

      ${painel("Minhas avaliações", tabela(
        [{ t: "Data" }, { t: "Avaliação" }, { t: "Disciplina" }, { t: "Nota", num: 1 }, { t: "Aproveitamento", num: 1 }],
        [...r.notas].reverse().map(n => `<tr>
          <td class="mono nowrap">${dataBr(n.aval.assessment_date)}</td><td>${h(n.aval.name)}</td>
          <td class="mudo">${h(BASE.disciplinaDaOferta(n.aval.class_subject_id).name)}</td>
          <td class="num mono">${num(n.score, 2)} / ${num(n.aval.max_score, 0)}</td>
          <td class="num">${tag(faixa(n.percentage).classe, pct(n.percentage, 0))}</td></tr>`)), { nu: true })}`,
    depois() {
      grafLinha(el("me-ev"), { labels, series: [
        { nome: "Eu", dados: r.percentuais },
        { nome: "Média da turma", dados: r.notas.map(n => mapaTurma.get(n.assessment_id) ?? null), cor: "var(--serie-c)" }] });
      grafBarrasH(el("me-as"), r.assuntos.map(a => ({ nome: a.topic_name, valor: a.aproveitamento, nota: a.subject_name })));
    },
  };
};

/* ------------------------------------------------------------ professores */
VISTAS.professores = () => {
  const linhas = DADOS.professores.map(p => {
    const ofertas = BASE.ofertasDoProfessor(p.id);
    return { p, ofertas,

      avaliacoes: DADOS.avaliacoes.filter(a => ofertas.includes(a.class_subject_id)).length };

  return {
    html: `
      <div class="cabec">
        <div><h1>Professores</h1>
          <p>${linhas.length} professor(es). O vínculo é sempre com uma <strong>turma + disciplina</strong>:
             é ele que define o que cada um enxerga.</p></div>
      </div>
      ${painel("Equipe", tabela(
        [{ t: "Professor" }, { t: "Contato" }, { t: "Perfil" }, { t: "Turmas", num: 1 },
         { t: "Disciplinas", num: 1 }, { t: "Aulas", num: 1 }, { t: "Avaliações", num: 1 }, { t: "Situação" }],
        linhas.map(l => `<tr class="linha-clicavel" data-professor="${l.p.id}">
          <td><div style="display:flex;align-items:center;gap:8px">
            <span class="perfil__avatar">${h(iniciais(l.p.name))}</span>
            <span>${h(l.p.name)}<div class="mudo" style="font-size:11.5px">${h(l.p.qualification ?? "")}</div></span></div></td>
          <td class="mudo" style="font-size:12px">${h(l.p.email)}<div>${h(l.p.phone ?? "")}</div></td>
          <td>${tag(l.p.role === "admin" ? "roxo" : "info", l.p.role === "admin" ? "Administrador" : "Professor")}</td>
          <td class="num">${l.turmas}</td><td class="num">${l.disciplinas}</td>
          <td class="num">${l.aulas}</td><td class="num">${l.avaliacoes}</td>
          <td>${tag(l.p.is_active ? "bom" : "neutro", l.p.is_active ? "Ativo" : "Inativo")}</td></tr>`)), { nu: true })}`,
  };
};

/* ------------------------------------------------------ ficha do professor */
VISTAS.professor = () => {
  const p = BASE.professorPorId.get(rota.id);
  if (!p) return { html: '<div class="vazio">Professor não encontrado.</div>' };
  const ofertas = BASE.ofertasDoProfessor(p.id);
  const f = ofertas.length ? { ofertas } : { ofertas: [] };
  const rk = BASE.ranking(CFG, f);
  const classes = { evolucao: 0, intermediario: 0, atencao: 0, sem_dados: 0 };
  rk.forEach(r => classes[r.classificacao]++);
  const media = BASE.mediaGeral(f);
  const acertos = BASE.totaisDeResposta(BASE.respostas(f));
  const assuntos = BASE.aproveitamentoPorAssunto(BASE.respostas(f), CFG);

  return {
    html: `
      <div class="cabec">
        <div style="display:flex;gap:12px;align-items:center">
          <span class="perfil__avatar" style="width:42px;height:42px;font-size:14px">${h(iniciais(p.name))}</span>
          <div><h1>${h(p.name)}</h1>
            <p><button class="migalha" data-ir="professores">Professores</button> · ${h(p.email)}
              ${p.qualification ? " · " + h(p.qualification) : ""}
              · ${tag(p.role === "admin" ? "roxo" : "info", p.role === "admin" ? "Administrador" : "Professor")}</p></div>
        </div>
        <div class="cabec__acoes">
          <button class="btn" data-ver-como="${p.id}">Ver o painel dele</button>
        </div>
      </div>

      <div class="kpis">
        ${kpi("Ofertas", ofertas.length, "turma × disciplina")}
        ${kpi("Aulas / Avaliações",
          `${DADOS.aulas.filter(l => ofertas.includes(l.class_subject_id)).length} / ${DADOS.avaliacoes.filter(a => ofertas.includes(a.class_subject_id)).length}`,
          "registradas por ele")}
        ${kpi("Média das turmas dele", pct(media), "", faixa(media).classe)}
        ${kpi("% de acertos", pct(acertos.pct_acertos), `${acertos.total} respostas`, faixa(acertos.pct_acertos).classe)}
        ${kpi("Em evolução", classes.evolucao, "", "bom")}
        ${kpi("Precisam de atenção", classes.atencao, "nas turmas dele", "ruim")}
      </div>

      <div class="colunas c-21">
        <div>
          ${painel("Turmas e disciplinas", ofertas.length === 0
            ? '<div class="vazio">Este professor ainda não responde por nenhuma turma.</div>'
            : tabela([{ t: "Turma" }, { t: "Disciplina" }, { t: "Curso" }, { t: "Alunos", num: 1 },
                      { t: "Aulas", num: 1 }, { t: "Avaliações", num: 1 }],
              ofertas.map(id => {
                const o = BASE.oferta(id);
                const t = BASE.turmaPorId.get(o.class_id), d = BASE.disciplinaPorId.get(o.subject_id);
                return `<tr><td><strong>${h(t.code)}</strong><div class="mudo" style="font-size:11.5px">${t.year}</div></td>
                  <td>${h(d.name)}</td><td class="mudo">${h(BASE.cursoPorId.get(t.course_id).name)}</td>
                  <td class="num">${DADOS.alunos.filter(a => a.class_id === t.id).length}</td>
                  <td class="num">${DADOS.aulas.filter(l => l.class_subject_id === id).length}</td>
                  <td class="num">${DADOS.avaliacoes.filter(a => a.class_subject_id === id).length}</td></tr>`;
              })), { nu: true })}

          ${painel("Alunos atendidos", tabela(COLS_RANKING, rk.map(r => linhaRanking(r))), { nu: true,
            direita: `<span class="tag tag--neutro">${rk.length} aluno(s)</span>` })}
        </div>
        <div>
          ${painel("Assuntos das turmas dele", assuntos.length === 0
            ? '<div class="vazio">Sem respostas registradas.</div>'
            : `<div class="rolagem"><table><tbody>${assuntos.slice(0, 8).map(a => `
                <tr><td>${h(a.topic_name)}<div class="mudo" style="font-size:11.5px">${h(a.subject_name)}</div></td>
                  <td style="width:140px">${barra(a.aproveitamento)}</td></tr>`).join("")}</tbody></table></div>`, { nu: true })}
        </div>
      </div>`,
  };
};
</script>

<script>
/* ------------------------------------------------------------------ turmas */
VISTAS.turmas = () => ({
  html: `
    <div class="cabec">
      <div><h1>Turmas</h1><p>${M.turmas.length} turma(s) no seu escopo.</p></div>
    </div>
    ${avisoEscopo()}
    ${painel("Turmas", tabela(
      [{ t: "Turma" }, { t: "Curso" }, { t: "Período" }, { t: "Alunos", num: 1 },
       { t: "Disciplinas", num: 1 }, { t: "Média", num: 1 }],
      M.turmas.map(t => {
        const f = { ...escopo(), turma: t.id };
        const media = BASE.mediaGeral(f);
        const ofertas = DADOS.ofertas.filter(o => o.class_id === t.id && BASE.ofertaPassa(o.id, escopo()));
        return `<tr class="linha-clicavel" data-turma="${t.id}">
          <td><strong>${h(t.code)}</strong><div class="mudo" style="font-size:11.5px">${h(t.name ?? "")}</div></td>
          <td>${h(BASE.cursoPorId.get(t.course_id).name)}<div class="mudo" style="font-size:11.5px">${t.year}</div></td>
          <td class="mudo" style="font-size:12px">${h(t.period ?? "—")}<div>${dataBr(t.start_date)} a ${dataBr(t.end_date)}</div></td>
          <td class="num">${DADOS.alunos.filter(a => a.class_id === t.id).length}</td>
          <td class="num">${ofertas.length}</td>
          <td class="num">${tag(faixa(media).classe, pct(media, 0))}</td></tr>`;
      })), { nu: true })}`,
});

VISTAS.turma = () => {
  const t = BASE.turmaPorId.get(rota.id);
  if (!t) return { html: '<div class="vazio">Turma não encontrada.</div>' };
  const f = { ...escopo(), turma: t.id };
  const rk = BASE.ranking(CFG, f);
  const classes = { evolucao: 0, intermediario: 0, atencao: 0, sem_dados: 0 };
  rk.forEach(r => classes[r.classificacao]++);
  const assuntos = BASE.aproveitamentoPorAssunto(BASE.respostas(f), CFG);
  const serie = BASE.mediaPorAvaliacao(f);
  const ofertas = DADOS.ofertas.filter(o => o.class_id === t.id && BASE.ofertaPassa(o.id, escopo()));

  return {
    html: `
      <div class="cabec">
        <div><h1>Turma ${h(t.code)}</h1>
          <p><button class="migalha" data-ir="turmas">Turmas</button> · ${h(BASE.cursoPorId.get(t.course_id).name)}
            · ${t.year} · ${h(t.period ?? "")}</p></div>
      </div>
      <div class="kpis">
        ${kpi("Média da turma", pct(BASE.mediaGeral(f)), `${rk.length} aluno(s)`, faixa(BASE.mediaGeral(f)).classe)}
        ${kpi("% de acertos", pct(BASE.totaisDeResposta(BASE.respostas(f)).pct_acertos), "", faixa(BASE.totaisDeResposta(BASE.respostas(f)).pct_acertos).classe)}
        ${kpi("Disciplinas", ofertas.length, "no seu escopo")}
        ${kpi("Em evolução", classes.evolucao, "", "bom")}
        ${kpi("Intermediários", classes.intermediario, "", "medio")}
        ${kpi("Precisam de atenção", classes.atencao, "", "ruim")}
      </div>
      <div class="colunas c-2">
        ${painel("Evolução da turma", grafico("tu-ev"))}
        ${painel("Assuntos", grafico("tu-as", 200))}
      </div>
      ${painel("Disciplinas da turma", tabela(
        [{ t: "Disciplina" }, { t: "Professor" }, { t: "Aulas", num: 1 }, { t: "Avaliações", num: 1 }, { t: "Média", num: 1 }],
        ofertas.map(o => {
          const d = BASE.disciplinaPorId.get(o.subject_id);
          const prof = o.teacher_user_id ? BASE.professorPorId.get(o.teacher_user_id) : null;
          const m = BASE.mediaGeral({ ...escopo(), ofertas: [o.id] });
          return `<tr><td><strong>${h(d.name)}</strong></td>
            <td>${prof ? h(prof.name) : '<span class="mudo">sem professor</span>'}</td>
            <td class="num">${DADOS.aulas.filter(l => l.class_subject_id === o.id).length}</td>
            <td class="num">${DADOS.avaliacoes.filter(a => a.class_subject_id === o.id).length}</td>
            <td class="num">${tag(faixa(m).classe, pct(m, 0))}</td></tr>`;
        })), { nu: true })}
      ${painel("Alunos", tabela(COLS_RANKING, rk.map(r => linhaRanking(r))), { nu: true })}`,
    depois() {
      grafLinha(el("tu-ev"), { labels: serie.map(a => a.nome), series: [{ nome: "Média (%)", dados: serie.map(a => a.media) }] });
      grafBarrasH(el("tu-as"), assuntos.map(a => ({ nome: a.topic_name, valor: a.aproveitamento, nota: a.subject_name })));
    },
  };
};

/* ------------------------------------------------------------- disciplinas */
VISTAS.disciplinas = () => ({
  html: `
    <div class="cabec">
      <div><h1>Disciplinas</h1><p>${M.disciplinas.length} disciplina(s) no seu escopo.</p></div>
    </div>
    ${avisoEscopo()}
    ${painel("Disciplinas", tabela(
      [{ t: "Disciplina" }, { t: "Professor responsável" }, { t: "Carga", num: 1 },
       { t: "Turmas", num: 1 }, { t: "Assuntos", num: 1 }, { t: "Questões", num: 1 }, { t: "Média", num: 1 }],
      M.disciplinas.map(d => {
        const f = { ...escopo(), disciplina: d.id };
        const media = BASE.mediaGeral(f);
        const prof = d.teacher_user_id ? BASE.professorPorId.get(d.teacher_user_id) : null;
        return `<tr class="linha-clicavel" data-disciplina="${d.id}">
          <td><strong>${h(d.name)}</strong><div class="mudo" style="font-size:11.5px">${h(cortar(d.description ?? "", 60))}</div></td>
          <td>${prof ? h(prof.name) : '<span class="mudo">—</span>'}</td>
          <td class="num">${d.workload_hours ?? "—"}h</td>
          <td class="num">${DADOS.ofertas.filter(o => o.subject_id === d.id && BASE.ofertaPassa(o.id, escopo())).length}</td>
          <td class="num">${DADOS.topicos.filter(t => t.subject_id === d.id && t.parent_id === null).length}</td>
          <td class="num">${DADOS.questoes.filter(q => { const t = BASE.topicoPorId.get(q.topic_id); return t && t.subject_id === d.id; }).length}</td>
          <td class="num">${tag(faixa(media).classe, pct(media, 0))}</td></tr>`;
      })), { nu: true })}`,
});

VISTAS.disciplina = () => {
  const d = BASE.disciplinaPorId.get(rota.id);
  if (!d) return { html: '<div class="vazio">Disciplina não encontrada.</div>' };
  const f = { ...escopo(), disciplina: d.id };
  const assuntos = BASE.aproveitamentoPorAssunto(BASE.respostas(f), CFG);
  const porAssunto = new Map(assuntos.map(a => [a.topic_id, a]));
  const raizes = DADOS.topicos.filter(t => t.subject_id === d.id && t.parent_id === null);

  return {
    html: `
      <div class="cabec">
        <div><h1>${h(d.name)}</h1>
          <p><button class="migalha" data-ir="disciplinas">Disciplinas</button> · ${h(d.description ?? "")}
            · ${raizes.length} assuntos</p></div>
      </div>
      <div class="kpis">
        ${kpi("Média da disciplina", pct(BASE.mediaGeral(f)), "", faixa(BASE.mediaGeral(f)).classe)}
        ${kpi("% de acertos", pct(BASE.totaisDeResposta(BASE.respostas(f)).pct_acertos), "", faixa(BASE.totaisDeResposta(BASE.respostas(f)).pct_acertos).classe)}
        ${kpi("Assuntos", raizes.length, `${DADOS.topicos.filter(t => t.subject_id === d.id && t.parent_id !== null).length} tópicos`)}
        ${kpi("Turmas", DADOS.ofertas.filter(o => o.subject_id === d.id && BASE.ofertaPassa(o.id, escopo())).length, "no seu escopo")}
      </div>
      <div class="colunas c-2">
        ${painel("Aproveitamento por assunto", grafico("di-as", 200))}
        ${painel("Por nível de dificuldade", grafico("di-dif", 130))}
      </div>
      ${painel("Assuntos e tópicos", `<div style="display:grid;gap:8px">
        ${raizes.map(raiz => {
          const stat = porAssunto.get(raiz.id);
          const filhos = DADOS.topicos.filter(t => t.parent_id === raiz.id);
          const fx = faixa(stat?.aproveitamento ?? null);
          return `<div style="border:1px solid var(--fio);border-radius:var(--r-s);padding:9px 11px">
            <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">
              <strong>${h(raiz.name)}</strong>${tag("info", "assunto")}
              <span style="margin-left:auto;min-width:150px">${barra(stat?.aproveitamento ?? null)}</span>
              ${tag(fx.classe, fx.texto)}
            </div>
            <div class="mudo" style="font-size:12px;margin-top:4px">${filhos.map(t => h(t.name)).join(" · ")}</div>
          </div>`;
        }).join("")}</div>`)}`,
    depois() {
      grafBarrasH(el("di-as"), assuntos.map(a => ({ nome: a.topic_name, valor: a.aproveitamento, nota: `${a.respondidas} respostas` })));
      grafBarrasH(el("di-dif"), BASE.aproveitamentoPorDificuldade(BASE.respostas(f))
        .map(x => ({ nome: DIFICULDADE[x.dificuldade], valor: x.aproveitamento, nota: `${x.respondidas} questões` })), { rotuloLargura: 110 });
    },
  };
};

/* ------------------------------------------------------------------- aulas */
VISTAS.aulas = () => ({
  html: `
    <div class="cabec">
      <div><h1>Aulas</h1><p>${M.aulas.length} aula(s) no seu escopo. Abra a chamada para ver — e alterar — a frequência.</p></div>
    </div>
    ${avisoEscopo()}
    ${painel("Aulas registradas", tabela(
      [{ t: "Data" }, { t: "Aula" }, { t: "Turma / Disciplina" }, { t: "Duração", num: 1 }, { t: "Chamada" }, { t: "" }],
      [...M.aulas].reverse().map(a => {
        const regs = DADOS.presencas.filter(p => p.lesson_id === a.id);
        const presentes = regs.filter(p => p.status === "presente" || p.status === "atraso").length;
        const t = BASE.turmaDaOferta(a.class_subject_id), d = BASE.disciplinaDaOferta(a.class_subject_id);
        return `<tr class="linha-clicavel" data-aula="${a.id}">
          <td class="mono nowrap">${dataBr(a.lesson_date)}</td>
          <td><strong>${h(a.title)}</strong><div class="mudo" style="font-size:11.5px">${h(cortar(a.content ?? "", 70))}</div></td>
          <td class="pequeno">${h(t.code)}<div class="mudo">${h(d.name)}</div></td>
          <td class="num">${a.duration_minutes} min</td>
          <td>${tag(presentes === regs.length ? "bom" : "medio", `${presentes}/${regs.length} presentes`)}</td>
          <td class="num"><span class="btn btn--min">Chamada</span></td></tr>`;
      })), { nu: true })}`,
});

VISTAS.chamada = () => {
  const aula = BASE.aulaPorId.get(rota.id);
  if (!aula) return { html: '<div class="vazio">Aula não encontrada.</div>' };
  const t = BASE.turmaDaOferta(aula.class_subject_id), d = BASE.disciplinaDaOferta(aula.class_subject_id);
  const alunos = DADOS.alunos.filter(a => a.class_id === t.id);
  const opcoes = [["presente", "Presente"], ["atraso", "Atraso"], ["falta", "Falta"], ["falta_justificada", "Justificada"]];

  return {
    html: `
      <div class="cabec">
        <div><h1>Chamada</h1>
          <p><button class="migalha" data-ir="aulas">Aulas</button> · <strong>${h(aula.title)}</strong>
            · ${dataBr(aula.lesson_date)} · ${h(t.code)} — ${h(d.name)}</p></div>
      </div>
      <div class="aviso"><b>Interativo</b><div>Troque a situação de um aluno: frequência, Índice de
        Desenvolvimento, ranking e alertas são recalculados na hora — como no sistema real.</div></div>
      ${painel(`${alunos.length} aluno(s)`, tabela(
        [{ t: "Aluno" }, { t: "Situação" }, { t: "Participação", num: 1 }, { t: "Frequência acumulada", num: 1 }],
        alunos.map(al => {
          const p = DADOS.presencas.find(x => x.lesson_id === aula.id && x.student_id === al.id);
          const freq = BASE.frequencia(al.id, CFG, escopo()).frequencia;
          return `<tr>
            <td>${h(al.full_name)}</td>
            <td><select data-presenca="${al.id}" style="padding:4px 6px;border-radius:5px;border:1px solid var(--fio-forte);background:var(--elevado);color:var(--tinta);font:inherit;font-size:12.5px">
              ${opcoes.map(([v, txt]) => `<option value="${v}" ${p?.status === v ? "selected" : ""}>${txt}</option>`).join("")}
            </select></td>
            <td class="num mono">${p?.participation ?? "—"}</td>
            <td class="num">${tag(freq >= CFG.frequencia_minima ? "bom" : "ruim", pct(freq, 1))}</td></tr>`;
        })), { nu: true })}`,
    depois() {
      document.querySelectorAll("[data-presenca]").forEach(sel => {
        sel.addEventListener("change", () => {
          const id = Number(sel.dataset.presenca);
          const reg = DADOS.presencas.find(x => x.lesson_id === aula.id && x.student_id === id);
          if (reg) reg.status = sel.value;
          registrarAuditoria("registrou chamada", "aula", aula.title);
          recalcular(); render();
        });
      });
    },
  };
};

/* -------------------------------------------------------------- avaliações */
VISTAS.avaliacoes = () => ({
  html: `
    <div class="cabec">
      <div><h1>Avaliações</h1><p>${M.avaliacoes.length} avaliação(ões) no seu escopo.</p></div>
    </div>
    ${avisoEscopo()}
    ${painel("Avaliações", tabela(
      [{ t: "Data" }, { t: "Avaliação" }, { t: "Turma / Disciplina" }, { t: "Tipo" }, { t: "Peso", num: 1 },
       { t: "Questões", num: 1 }, { t: "Lançados", num: 1 }, { t: "Média", num: 1 }, { t: "" }],
      [...M.porAvaliacao].reverse().map(a => {
        const av = BASE.avaliacaoPorId.get(a.assessment_id);
        return `<tr class="linha-clicavel" data-avaliacao="${av.id}">
          <td class="mono nowrap">${dataBr(av.assessment_date)}</td>
          <td><strong>${h(av.name)}</strong></td>
          <td class="pequeno">${h(a.class_code)}<div class="mudo">${h(a.subject_name)}</div></td>
          <td class="mudo">${h(TIPO_AVALIACAO[av.type])}</td>
          <td class="num mono">${num(av.weight, 1)}</td>
          <td class="num">${DADOS.questoes.filter(q => q.assessment_id === av.id).length}</td>
          <td class="num">${a.alunos}</td>
          <td class="num">${tag(faixa(a.media).classe, pct(a.media, 1))}</td>
          <td class="num"><span class="btn btn--min">Resultados</span></td></tr>`;
      })), { nu: true })}`,
});

VISTAS.avaliacao = () => {
  const av = BASE.avaliacaoPorId.get(rota.id);
  if (!av) return { html: '<div class="vazio">Avaliação não encontrada.</div>' };
  const questoes = BASE.analiseDaAvaliacao(av.id, CFG);
  const t = BASE.turmaDaOferta(av.class_subject_id), d = BASE.disciplinaDaOferta(av.class_subject_id);
  const alunos = DADOS.alunos.filter(a => a.class_id === t.id);
  const notas = DADOS.notas.filter(n => n.assessment_id === av.id);
  const p = notas.map(n => n.percentage);
  const respostasAv = DADOS.respostas.filter(r => questoes.some(q => q.id === r.question_id));
  const assuntosAv = BASE.aproveitamentoPorAssunto(respostasAv, CFG);
  const totais = BASE.totaisDeResposta(respostasAv);
  const matriz = new Map(respostasAv.map(r => [r.student_id + ":" + r.question_id, r]));

  return {
    html: `
      <div class="cabec">
        <div><h1>${h(av.name)}</h1>
          <p><button class="migalha" data-ir="avaliacoes">Avaliações</button> · ${h(TIPO_AVALIACAO[av.type])}
            · ${dataBr(av.assessment_date)} · ${h(t.code)} — ${h(d.name)} · valor ${num(av.max_score, 0)}</p></div>
      </div>
      <div class="kpis">
        ${kpi("Média", pct(p.length ? r2(p.reduce((a, b) => a + b, 0) / p.length) : null), `${notas.length} aluno(s)`,
          faixa(p.length ? r2(p.reduce((a, b) => a + b, 0) / p.length) : null).classe)}
        ${kpi("Menor / Maior", `${pct(p.length ? Math.min(...p) : null, 0)} / ${pct(p.length ? Math.max(...p) : null, 0)}`,
          `desvio de ${num(desvioPadrao(p))} p.p.`)}
        ${kpi("% de acertos", pct(totais.pct_acertos), `${totais.branco} em branco`, faixa(totais.pct_acertos).classe)}
        ${kpi("Questões", questoes.length, `somando ${num(questoes.reduce((a, q) => a + q.points, 0), 2)} pontos`)}
      </div>
      <div class="colunas c-2">
        ${painel("Índice de acerto por questão", grafico("av-q", 230))}
        ${painel("Aproveitamento por assunto", grafico("av-as", 190))}
      </div>

      <div class="aviso"><b>Interativo</b><div>Clique em <b>C</b>, <b>E</b> ou <b>N</b> para lançar o resultado de
        um aluno numa questão. Nota, percentual, mapa de conteúdos, ranking e alertas são recalculados na hora.</div></div>

      ${painel("Resultados por questão", `<div class="grade-res">
        <table>
          <thead><tr><th>Aluno</th>
            ${questoes.map(q => `<th class="num" title="${h(q.assunto ?? "sem assunto")} · ${h(DIFICULDADE[q.difficulty])} · ${num(q.points, 2)} pt">${q.number}</th>`).join("")}
            <th class="num">Nota</th></tr></thead>
          <tbody>${alunos.map(al => {
            const nota = notas.find(n => n.student_id === al.id);
            return `<tr><th>${h(al.full_name)}</th>
              ${questoes.map(q => {
                const r = matriz.get(al.id + ":" + q.id);
                const marca = (v, rot) => `<button class="${v[0]}" data-marca="${al.id}|${q.id}|${v}"
                  aria-pressed="${r?.result === v}" title="${rot}">${rot[0]}</button>`;
                return `<td><div class="marcas">${marca("correta", "Certo")}${marca("incorreta", "Errado")}${marca("nao_respondida", "Não respondeu")}</div></td>`;
              }).join("")}
              <td class="num mono">${nota ? `<strong>${num(nota.score, 2)}</strong><br>${tag(faixa(nota.percentage).classe, pct(nota.percentage, 0))}` : "—"}</td>
            </tr>`;
          }).join("")}</tbody>
        </table></div>`, { nu: true, direita: '<span class="tag tag--neutro">C = certo · E = errado · N = não respondeu</span>' })}

      ${painel("Detalhe das questões", tabela(
        [{ t: "#", num: 1 }, { t: "Assunto" }, { t: "Dificuldade" }, { t: "Pontos", num: 1 },
         { t: "C / E / B", num: 1 }, { t: "Índice de acerto" }],
        questoes.map(q => `<tr>
          <td class="num mono">${q.number}</td><td>${h(q.assunto ?? "—")}</td>
          <td>${tag({ facil: "bom", medio: "medio", dificil: "ruim" }[q.difficulty], DIFICULDADE[q.difficulty])}</td>
          <td class="num mono">${num(q.points, 2)}</td>
          <td class="num mono">${q.acertos}/${q.erros}/${q.branco}</td>
          <td>${barra(q.indice_acerto)}</td></tr>`)), { nu: true })}`,
    depois() {
      grafBarrasV(el("av-q"), { labels: questoes.map(q => "Q" + q.number), altura: 230,
        series: [{ nome: "Índice de acerto", dados: questoes.map(q => q.indice_acerto),
          cores: questoes.map(q => faixa(q.indice_acerto).cor) }] });
      grafBarrasH(el("av-as"), assuntosAv.map(a => ({ nome: a.topic_name, valor: a.aproveitamento, nota: `${a.respondidas} respostas` })));

      document.querySelectorAll("[data-marca]").forEach(b => {
        b.addEventListener("click", () => {
          const [alunoId, questaoId, valor] = b.dataset.marca.split("|");
          const q = BASE.questaoPorId.get(Number(questaoId));
          let r = DADOS.respostas.find(x => x.student_id === +alunoId && x.question_id === +questaoId);
          if (!r) { r = { question_id: +questaoId, student_id: +alunoId, result: valor, score_earned: 0 }; DADOS.respostas.push(r); }
          r.result = valor;
          r.score_earned = valor === "correta" ? q.points : 0;
          recalcularNota(av.id, +alunoId);
          registrarAuditoria("lançou resultados", "avaliacao", av.name);
          recalcular(); render();
        });
      });
    },
  };
};

/* ---------------------------------------------------------------- questões */
VISTAS.questoes = () => {
  const disciplinasOk = new Set(M.disciplinas.map(d => d.id));
  const linhas = DADOS.questoes.filter(q => {
    const t = BASE.topicoPorId.get(q.topic_id);
    return t && disciplinasOk.has(t.subject_id);
  }).map(q => {
    const resp = DADOS.respostas.filter(r => r.question_id === q.id);
    const acertos = resp.filter(r => r.result === "correta").length;
    const raiz = BASE.raiz(q.topic_id), filho = BASE.topicoPorId.get(q.topic_id);
    return { q, raiz, filho, respondidas: resp.length,
      indice: resp.length ? r2(acertos / resp.length * 100) : null,
      avaliacao: BASE.avaliacaoPorId.get(q.assessment_id),
      disciplina: BASE.disciplinaPorId.get(raiz.subject_id) };
  });

  return {
    html: `
      <div class="cabec">
        <div><h1>Banco de questões</h1>
          <p>${linhas.length} questões classificadas por assunto e dificuldade, com o índice de acerto real.</p></div>
        <div class="cabec__acoes">
          <select id="f-dif" class="busca" aria-label="Filtrar por dificuldade">
            <option value="">Todas as dificuldades</option>
            <option value="facil">Fácil</option><option value="medio">Médio</option><option value="dificil">Difícil</option>
          </select>
        </div>
      </div>
      ${avisoEscopo()}
      ${painel("Questões", `<div id="tab-q"></div>`, { nu: true })}`,
    depois() {
      const desenhar = () => {
        const dif = el("f-dif").value;
        el("tab-q").innerHTML = tabela(
          [{ t: "Avaliação" }, { t: "#", num: 1 }, { t: "Disciplina / assunto" }, { t: "Dificuldade" },
           { t: "Pontos", num: 1 }, { t: "Gabarito" }, { t: "Índice de acerto" }],
          linhas.filter(l => !dif || l.q.difficulty === dif).map(l => `<tr>
            <td style="font-size:12.5px">${h(l.avaliacao.name)}<div class="mudo mono" style="font-size:11px">${dataBr(l.avaliacao.assessment_date)}</div></td>
            <td class="num mono">${l.q.number}</td>
            <td>${h(l.disciplina.name)}<div class="mudo" style="font-size:11.5px">${h(l.raiz.name)}${l.filho && l.filho.id !== l.raiz.id ? " › " + h(l.filho.name) : ""}</div></td>
            <td>${tag({ facil: "bom", medio: "medio", dificil: "ruim" }[l.q.difficulty], DIFICULDADE[l.q.difficulty])}</td>
            <td class="num mono">${num(l.q.points, 2)}</td>
            <td class="mono">${h(l.q.answer_key ?? "—")}</td>
            <td>${barra(l.indice)}<div class="mudo" style="font-size:11px">${l.respondidas} respostas</div></td></tr>`),
          { vazio: "Nenhuma questão nesse filtro." });
      };
      el("f-dif").addEventListener("change", desenhar);
      desenhar();
    },
  };
};

/* --------------------------------------------------------- acompanhamento */
VISTAS.acompanhamento = () => {
  const visiveis = DADOS.acompanhamentos.filter(i => {
    if (PERFIL.papel === "admin") return true;
    const ofertas = BASE.ofertasDoProfessor(PERFIL.userId);
    if (i.class_subject_id) return ofertas.includes(i.class_subject_id);
    const aluno = BASE.alunoPorId.get(i.student_id);
    return aluno && ofertas.some(id => BASE.oferta(id).class_id === aluno.class_id);
  });
  const contagem = { aberta: 0, em_andamento: 0, concluida: 0, cancelada: 0, atrasadas: 0 };
  const hoje = new Date().toISOString().slice(0, 10);
  visiveis.forEach(i => {
    contagem[i.status]++;
    if (["aberta", "em_andamento"].includes(i.status) && i.due_date && i.due_date < hoje) contagem.atrasadas++;
  });

  return {
    html: `
      <div class="cabec">
        <div><h1>Acompanhamento pedagógico</h1>
          <p>O que foi <strong>feito</strong> com cada aluno sinalizado. A média e a frequência do momento da
             abertura ficam guardadas — a coluna “efeito” mostra o que mudou desde então.</p></div>
      </div>
      ${avisoEscopo()}
      <div class="kpis">
        ${kpi("Abertos", contagem.aberta, "", "medio")}
        ${kpi("Em andamento", contagem.em_andamento, "", "acento")}
        ${kpi("Concluídos", contagem.concluida, "", "bom")}
        ${kpi("Prazo vencido", contagem.atrasadas, "abertos e fora do prazo", "ruim")}
      </div>
      ${painel("Registros", visiveis.length === 0
        ? '<div class="vazio">Nenhum acompanhamento no seu escopo. Abra um a partir de um alerta.</div>'
        : tabela([{ t: "Aluno" }, { t: "Acompanhamento" }, { t: "Tipo" }, { t: "Prazo" },
                  { t: "Situação" }, { t: "Efeito na média", num: 1 }],
          visiveis.map(i => {
            const aluno = BASE.alunoPorId.get(i.student_id);
            const resumo = BASE.resumoDoAluno(i.student_id, CFG, {});
            const efeito = (i.baseline_media !== null && resumo.media !== null)
              ? r2(resumo.media - i.baseline_media) : null;
            const atrasado = ["aberta", "em_andamento"].includes(i.status) && i.due_date && i.due_date < hoje;
            const oferta = i.class_subject_id ? BASE.oferta(i.class_subject_id) : null;
            const autor = i.author_user_id ? BASE.professorPorId.get(i.author_user_id) : null;
            return `<tr>
              <td><button class="migalha" data-aluno="${i.student_id}">${h(aluno.full_name)}</button>
                ${oferta ? `<div class="mudo" style="font-size:11.5px">${h(BASE.turmaPorId.get(oferta.class_id).code)} · ${h(BASE.disciplinaPorId.get(oferta.subject_id).name)}</div>` : ""}</td>
              <td><strong>${h(i.title)}</strong>
                <div class="mudo" style="font-size:11.5px">${h(cortar(i.description ?? "", 80))}</div>
                <div class="mudo" style="font-size:11px">por ${h(autor?.name ?? "—")} · ${dataBr(i.created_at)}</div></td>
              <td class="pequeno">${h(TIPO_ACOMP[i.type])}</td>
              <td class="pequeno nowrap">${i.due_date ? dataBr(i.due_date) : '<span class="mudo">—</span>'}
                ${atrasado ? "<br>" + tag("ruim", "vencido") : ""}</td>
              <td>${tag({ aberta: "medio", em_andamento: "info", concluida: "bom", cancelada: "neutro" }[i.status], STATUS_ACOMP[i.status])}</td>
              <td class="num">${efeito === null
                ? '<span class="mudo" style="font-size:11.5px">sem linha de base</span>'
                : `${tag(efeito >= 0 ? "bom" : "ruim", (efeito >= 0 ? "+" : "") + num(efeito) + " p.p.")}
                   <div class="mudo" style="font-size:11px">de ${pct(i.baseline_media, 0)} para ${pct(resumo.media, 0)}</div>`}</td>
            </tr>`;
          })), { nu: true })}`,
  };
};

/** Registrar acompanhamento — o formulário grava na memória da aba. */
VISTAS["acompanhamento-form"] = () => {
  const alunoPre = rota.id?.aluno ?? M.ranking[0]?.id;
  const tituloPre = rota.id?.titulo ?? "";
  const alunos = M.ranking.length ? M.ranking.map(r => r.aluno) : M.alunos;
  return {
    html: `
      <div class="cabec">
        <div><h1>Novo acompanhamento</h1>
          <p>A média e a frequência atuais do aluno serão guardadas como linha de base para medir o efeito.</p></div>
        <div class="cabec__acoes"><button class="btn" data-ir="acompanhamento">Voltar</button></div>
      </div>
      ${painel("Registro", `
        <div class="grade-campos">
          <div class="campo"><label for="ac-aluno">Aluno</label>
            <select id="ac-aluno" class="busca" style="width:100%">
              ${alunos.map(a => `<option value="${a.id}" ${a.id === alunoPre ? "selected" : ""}>${h(a.full_name)}</option>`).join("")}
            </select></div>
          <div class="campo"><label for="ac-oferta">Turma / disciplina</label>
            <select id="ac-oferta" class="busca" style="width:100%">
              <option value="">— Geral —</option>
              ${M.ofertas.map(o => `<option value="${o.id}">${h(o.turma.code)} — ${h(o.disciplina.name)}</option>`).join("")}
            </select></div>
          <div class="campo"><label for="ac-tipo">Tipo</label>
            <select id="ac-tipo" class="busca" style="width:100%">
              ${Object.entries(TIPO_ACOMP).map(([k, v]) => `<option value="${k}">${h(v)}</option>`).join("")}
            </select></div>
          <div class="campo"><label for="ac-status">Situação</label>
            <select id="ac-status" class="busca" style="width:100%">
              ${Object.entries(STATUS_ACOMP).map(([k, v]) => `<option value="${k}">${h(v)}</option>`).join("")}
            </select></div>
          <div class="campo"><label for="ac-prazo">Prazo</label>
            <input type="date" id="ac-prazo" class="busca" style="width:100%"></div>
        </div>
        <div class="campo" style="margin-top:12px"><label for="ac-titulo">Título</label>
          <input type="text" id="ac-titulo" class="busca" style="width:100%" value="${h(tituloPre)}"></div>
        <div class="campo" style="margin-top:10px"><label for="ac-desc">Situação observada</label>
          <textarea id="ac-desc" rows="2" style="width:100%;padding:6px 8px;border:1px solid var(--fio-forte);border-radius:var(--r-s);background:var(--elevado);color:var(--tinta);font:inherit;font-size:13px"></textarea></div>
        <div class="campo" style="margin-top:10px"><label for="ac-acao">Ação combinada</label>
          <textarea id="ac-acao" rows="2" style="width:100%;padding:6px 8px;border:1px solid var(--fio-forte);border-radius:var(--r-s);background:var(--elevado);color:var(--tinta);font:inherit;font-size:13px"></textarea></div>
        <div style="margin-top:14px;display:flex;gap:8px">
          <button class="btn btn--forte" id="ac-salvar">Registrar acompanhamento</button>
          <button class="btn" data-ir="acompanhamento">Cancelar</button>
        </div>`)}`,
    depois() {
      el("ac-salvar").addEventListener("click", () => {
        const alunoId = Number(el("ac-aluno").value);
        const resumo = BASE.resumoDoAluno(alunoId, CFG, {});
        DADOS.acompanhamentos.push({
          id: Math.max(0, ...DADOS.acompanhamentos.map(i => i.id)) + 1,
          student_id: alunoId,
          class_subject_id: el("ac-oferta").value ? Number(el("ac-oferta").value) : null,
          author_user_id: PERFIL.userId ?? 1,
          type: el("ac-tipo").value, status: el("ac-status").value,
          title: el("ac-titulo").value || "Acompanhamento",
          description: el("ac-desc").value, action_taken: el("ac-acao").value,
          due_date: el("ac-prazo").value || null, result_note: null,
          baseline_media: resumo.media, baseline_frequencia: resumo.frequencia,
          created_at: new Date().toISOString().slice(0, 10),
        });
        registrarAuditoria("abriu", "acompanhamento", el("ac-titulo").value || "Acompanhamento");
        ir("acompanhamento");
      });
    },
  };
};
</script>

<script>
/* -------------------------------------------------------------- relatórios */
const RELATORIOS = {
  turma: () => ({
    titulo: "Desempenho da turma",
    colunas: ["Posição", "Aluno", "Turma", "Avaliações", "Média", "% acertos", "Frequência", "Evolução (p.p.)", "Índice", "Classificação"],
    linhas: M.ranking.map(r => [r.posicao ?? "—", r.aluno.full_name, r.turma?.code ?? "—", r.avaliacoes,
      { v: r.media }, { v: r.acertos.pct_acertos }, { v: r.frequencia }, num(r.evolucao_recente),
      num(r.indice), CLASSE_ALUNO[r.classificacao].texto]),
    resumo: { "Alunos": M.ranking.length, "Média geral": pct(M.mediaGeral),
      "Em evolução": M.classes.evolucao, "Intermediários": M.classes.intermediario,
      "Precisam de atenção": M.classes.atencao },
  }),
  aluno: () => {
    const r = M.ranking[0];
    if (!r) return { titulo: "Relatório individual", colunas: [], linhas: [], vazio: "Sem alunos no escopo." };
    return {
      titulo: `Relatório individual — ${r.aluno.full_name}`,
      nota: "No sistema instalado, escolha o aluno no filtro. Aqui mostramos o primeiro do ranking.",
      colunas: ["Data", "Avaliação", "Disciplina", "Tipo", "Nota", "Valor máximo", "Aproveitamento", "Acertos", "Erros", "Em branco"],
      linhas: r.notas.map(n => [dataBr(n.aval.assessment_date), n.aval.name,
        BASE.disciplinaDaOferta(n.aval.class_subject_id).name, TIPO_AVALIACAO[n.aval.type],
        num(n.score, 2), num(n.aval.max_score, 0), { v: n.percentage },
        n.correct_count, n.wrong_count, n.blank_count]),
      resumo: { "Turma": r.turma?.code ?? "—", "Avaliações": r.avaliacoes, "Média geral": pct(r.media),
        "Frequência": pct(r.frequencia), "Evolução recente": num(r.evolucao_recente) + " p.p.",
        "Índice": num(r.indice), "Classificação": CLASSE_ALUNO[r.classificacao].texto },
    };
  },
  disciplina: () => ({
    titulo: "Desempenho por disciplina",
    colunas: ["Disciplina", "Alunos", "Avaliações", "Média"],
    linhas: M.porDisciplina.map(d => [d.nome, d.alunos, d.avaliacoes, { v: d.media }]),
  }),
  avaliacao: () => ({
    titulo: "Desempenho por avaliação",
    colunas: ["Data", "Avaliação", "Turma", "Disciplina", "Alunos", "Média", "Menor", "Maior"],
    linhas: M.porAvaliacao.map(a => [dataBr(a.data), a.nome, a.class_code, a.subject_name,
      a.alunos, { v: a.media }, { v: a.minima }, { v: a.maxima }]),
  }),
  assunto: () => ({
    titulo: "Desempenho por assunto",
    colunas: ["Assunto", "Disciplina", "Alunos", "Questões", "Acertos", "Erros", "Aproveitamento", "Situação"],
    linhas: [...M.assuntos].reverse().map(a => [a.topic_name, a.subject_name, a.alunos, a.respondidas,
      a.acertos, a.erros, { v: a.aproveitamento }, faixa(a.amostra_suficiente ? a.aproveitamento : null).texto]),
  }),
  dificuldade: () => {
    const criticos = M.assuntos.filter(a => a.aproveitamento !== null && a.aproveitamento < CFG.limite_dificuldade);
    return {
      titulo: `Dificuldades (abaixo de ${fmt(CFG.limite_dificuldade, 0)}%)`,
      colunas: ["Assunto", "Disciplina", "Aproveitamento", "Alunos", "Questões", "Erros"],
      linhas: criticos.map(a => [a.topic_name, a.subject_name, { v: a.aproveitamento }, a.alunos, a.respondidas, a.erros]),
      vazio: "Nenhum assunto abaixo do limite configurado.",
    };
  },
  evolucao: () => ({
    titulo: "Evolução dos alunos",
    colunas: ["Aluno", "Avaliações", "Primeira nota", "Última nota", "Tendência (p.p./aval.)", "Evolução recente", "Consistência", "Classificação"],
    linhas: [...M.ranking].sort((a, b) => (b.evolucao_recente ?? -999) - (a.evolucao_recente ?? -999))
      .map(r => [r.aluno.full_name, r.avaliacoes,
        { v: r.percentuais[0] ?? null }, { v: r.percentuais[r.percentuais.length - 1] ?? null },
        num(r.evolucao_slope, 2), num(r.evolucao_recente), num(r.score_consistencia),
        CLASSE_ALUNO[r.classificacao].texto]),
  }),
  frequencia: () => ({
    titulo: "Frequência",
    colunas: ["Aluno", "Turma", "Aulas", "Presenças", "Atrasos", "Faltas", "Frequência", "Participação", "Situação"],
    linhas: M.ranking.map(r => [r.aluno.full_name, r.turma?.code ?? "—", r.presenca.aulas, r.presenca.presentes,
      r.presenca.atrasos, r.presenca.faltas, { v: r.frequencia }, num(r.participacao, 1),
      r.frequencia === null ? "Sem aulas" : (r.frequencia < CFG.frequencia_minima ? "Abaixo do mínimo" : "Regular")]),
  }),
  perda: () => ({
    titulo: "Pontuação deixada na prova",
    colunas: ["Avaliação", "Turma", "Alunos", "Pontos possíveis", "Pontos obtidos", "Pontos perdidos", "Aproveitamento"],
    linhas: BASE.perdaPorAvaliacao(M.f, 50).map(p => [p.assessment_name, p.class_code, p.alunos,
      num(p.pontos_possiveis, 1), num(p.pontos_obtidos, 1), num(p.pontos_perdidos, 1), { v: p.aproveitamento }]),
  }),
};
const NOMES_RELATORIO = { aluno: "Individual do aluno", turma: "Desempenho da turma",
  disciplina: "Por disciplina", avaliacao: "Por avaliação", assunto: "Por assunto",
  dificuldade: "Dificuldades", evolucao: "Evolução", frequencia: "Frequência",
  perda: "Pontuação perdida" };

VISTAS.relatorios = () => {
  const tipo = rota.id && RELATORIOS[rota.id] ? rota.id : "turma";
  const rel = RELATORIOS[tipo]();
  const numerica = (i) => {
    const c = rel.linhas[0]?.[i];
    if (c === undefined) return false;
    if (typeof c === "object" && c !== null) return true;
    if (typeof c === "number") return true;
    return /^[-+]?[\d.,]+$/.test(String(c).trim());
  };
  const celula = (c) => typeof c === "object" && c !== null
    ? (c.v === null || c.v === undefined ? '<span class="mudo">—</span>' : tag(faixa(c.v).classe, pct(c.v, 1)))
    : h(c);

  return {
    html: `
      <div class="cabec">
        <div><h1>Relatórios</h1>
          <p>No sistema instalado, cada relatório aceita filtros por curso, turma, disciplina, aluno, assunto,
             período e dificuldade, exporta CSV e tem versão para impressão em PDF.</p></div>
      </div>
      ${avisoEscopo()}
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px">
        ${Object.keys(RELATORIOS).map(k =>
          `<button class="btn ${k === tipo ? "btn--forte" : ""}" data-rel="${k}">${h(NOMES_RELATORIO[k])}</button>`).join("")}
      </div>
      ${rel.resumo ? `<div class="kpis">${Object.entries(rel.resumo).map(([k, v]) => kpi(k, `<span style="font-size:18px">${h(String(v))}</span>`)).join("")}</div>` : ""}
      ${rel.nota ? `<div class="aviso"><b>Nota</b><div>${h(rel.nota)}</div></div>` : ""}
      ${painel(h(rel.titulo), tabela(
        rel.colunas.map((c, i) => ({ t: c, num: numerica(i) })),
        rel.linhas.map(l => `<tr>${l.map((c, i) => `<td class="${numerica(i) ? "num" : ""}">${celula(c)}</td>`).join("")}</tr>`),
        { vazio: rel.vazio || "Sem dados." }),
        { nu: true, direita: `<span class="tag tag--neutro">${rel.linhas.length} linha(s)</span>` })}`,
    depois() {
      document.querySelectorAll("[data-rel]").forEach(b =>
        b.addEventListener("click", () => ir("relatorios", b.dataset.rel)));
    },
  };
};

/* ---------------------------------------------------------------- gráficos */
VISTAS.graficos = () => {
  const a = rota.id?.a ?? M.ranking[0]?.id;
  const b = rota.id?.b ?? M.ranking[M.ranking.length - 1]?.id;
  const rotulos = M.porAvaliacao.map(x => x.nome);
  const alinhar = (r) => M.porAvaliacao.map(x => r.notas.find(n => n.assessment_id === x.assessment_id)?.percentage ?? null);

  return {
    html: `
      <div class="cabec">
        <div><h1>Gráficos e comparações</h1>
          <p>Todos os gráficos saem dos mesmos dados, dentro do seu recorte.</p></div>
      </div>
      ${avisoEscopo()}
      ${M.ranking.length >= 2 ? painel("Comparação entre alunos", `
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">
          <div class="campo"><label for="cmp-a">Primeiro aluno</label>
            <select id="cmp-a" class="busca">${M.ranking.map(r => `<option value="${r.id}" ${r.id === a ? "selected" : ""}>${h(r.aluno.full_name)}</option>`).join("")}</select></div>
          <div class="campo"><label for="cmp-b">Segundo aluno</label>
            <select id="cmp-b" class="busca">${M.ranking.map(r => `<option value="${r.id}" ${r.id === b ? "selected" : ""}>${h(r.aluno.full_name)}</option>`).join("")}</select></div>
        </div>
        ${grafico("g-cmp")}`) : ""}

      <div class="colunas c-2">
        ${painel("Evolução geral", grafico("gg-ev"))}
        ${painel("Média por avaliação", grafico("gg-av"))}
      </div>
      <div class="colunas c-2">
        ${painel("Média por turma", grafico("gg-turma", 220))}
        ${painel("Média por disciplina", grafico("gg-disc", 220))}
      </div>
      <div class="colunas c-2">
        ${painel("Assuntos mais críticos", grafico("gg-pior", 200))}
        ${painel("Frequência por aluno", grafico("gg-freq", 220))}
      </div>`,
    depois() {
      if (M.ranking.length >= 2) {
        const desenhar = () => {
          const x = M.porAluno.get(+el("cmp-a").value), y = M.porAluno.get(+el("cmp-b").value);
          grafLinha(el("g-cmp"), { labels: rotulos, series: [
            { nome: x.aluno.full_name.split(" ")[0], dados: alinhar(x) },
            { nome: y.aluno.full_name.split(" ")[0], dados: alinhar(y), cor: "var(--serie-b)" }] });
        };
        el("cmp-a").addEventListener("change", () => ir("graficos", { a: +el("cmp-a").value, b: +el("cmp-b").value }));
        el("cmp-b").addEventListener("change", () => ir("graficos", { a: +el("cmp-a").value, b: +el("cmp-b").value }));
        desenhar();
      }
      grafLinha(el("gg-ev"), { labels: rotulos, series: [{ nome: "Média (%)", dados: M.porAvaliacao.map(x => x.media) }] });
      grafBarrasV(el("gg-av"), { labels: rotulos, series: [{ nome: "Média (%)", dados: M.porAvaliacao.map(x => x.media),
        cores: M.porAvaliacao.map(x => faixa(x.media).cor) }] });
      grafBarrasV(el("gg-turma"), { labels: M.porTurma.map(t => t.nome), altura: 220,
        series: [{ nome: "Média (%)", dados: M.porTurma.map(t => t.media), cor: "var(--serie-a)" }] });
      grafBarrasV(el("gg-disc"), { labels: M.porDisciplina.map(d => d.nome), altura: 220,
        series: [{ nome: "Média (%)", dados: M.porDisciplina.map(d => d.media),
          cores: M.porDisciplina.map(d => faixa(d.media).cor) }] });
      grafBarrasH(el("gg-pior"), M.assuntos.slice(0, 6).map(x => ({ nome: x.topic_name, valor: x.aproveitamento, nota: x.subject_name })));
      grafBarrasH(el("gg-freq"), M.ranking.map(r => ({ nome: r.aluno.full_name, valor: r.frequencia,
        cor: r.frequencia >= CFG.frequencia_minima ? "var(--bom)" : "var(--ruim)" })));
    },
  };
};

/* ----------------------------------------------------------- configurações */
const CONTROLES = [
  ["Faixas de classificação", [
    ["faixa_dominio", "Domínio a partir de (%)", 1, 100, 1],
    ["faixa_intermediario", "Intermediário a partir de (%)", 0, 99, 1],
    ["min_questoes_assunto", "Mínimo de questões por assunto", 1, 20, 1],
  ]],
  ["Pesos do Índice de Desenvolvimento", [
    ["peso_desempenho", "Desempenho", 0, 1, .05],
    ["peso_evolucao", "Evolução", 0, 1, .05],
    ["peso_frequencia", "Frequência", 0, 1, .05],
    ["peso_consistencia", "Consistência", 0, 1, .05],
    ["id_evolucao", "Corte “em evolução” (índice ≥)", 1, 100, 1],
    ["id_atencao", "Corte “precisa de atenção” (índice <)", 0, 99, 1],
  ]],
  ["Alertas e frequência", [
    ["frequencia_minima", "Frequência mínima (%)", 0, 100, 1],
    ["media_alerta", "Alerta de média abaixo de (%)", 0, 100, 1],
    ["queda_alerta", "Alerta de queda (p.p.)", 1, 40, 1],
    ["evolucao_alerta", "Destaque de evolução (p.p.)", 1, 40, 1],
    ["limite_dificuldade", "Limite de dificuldade (%)", 0, 100, 1],
    ["ocorrencias_persistente", "Ocorrências para dificuldade persistente", 2, 8, 1],
  ]],
];

VISTAS.config = () => {
  const s = CFG.peso_desempenho + CFG.peso_evolucao + CFG.peso_frequencia + CFG.peso_consistencia;
  const w = s > 0 ? [CFG.peso_desempenho / s, CFG.peso_evolucao / s, CFG.peso_frequencia / s, CFG.peso_consistencia / s] : [.4, .25, .15, .2];
  return {
    html: `
      <div class="cabec">
        <div><h1>Configurações</h1>
          <p>Estes são os critérios que produzem toda a análise. Mexa neles e veja a instituição
             inteira ser reclassificada na hora.</p></div>
        <div class="cabec__acoes"><button class="btn" id="restaurar">Restaurar padrões</button></div>
      </div>

      ${painel("Régua de faixas", `
        <div class="regua">
          <div class="regua__t">
            <div class="regua__f regua__f--ruim" style="width:${CFG.faixa_intermediario}%">Dificuldade</div>
            <div class="regua__f regua__f--medio" style="width:${Math.max(0, CFG.faixa_dominio - CFG.faixa_intermediario)}%">Intermediário</div>
            <div class="regua__f regua__f--bom" style="width:${Math.max(0, 100 - CFG.faixa_dominio)}%">Domínio</div>
          </div>
          <div class="regua__marcas"><span>0%</span>
            <span>corte ${fmt(CFG.faixa_intermediario, 0)}% · ${fmt(CFG.faixa_dominio, 0)}%</span><span>100%</span></div>
          <div class="regua__assuntos">
            ${M.assuntos.map(a => {
              const f = faixa(a.aproveitamento);
              return `<div class="regua__linha">
                <span>${h(a.topic_name)}</span>
                <span class="regua__pista"><span class="regua__valor" style="width:${a.aproveitamento ?? 0}%;background:${f.cor}"></span></span>
                <span style="display:flex;gap:6px;align-items:center;justify-content:flex-end">
                  <span class="mono" style="font-size:12px">${pct(a.aproveitamento, 0)}</span>${tag(f.classe, f.texto)}</span>
              </div>`;
            }).join("")}
          </div>
        </div>`, { direita: `<span class="tag tag--neutro">${M.assuntos.length} assuntos, reclassificados ao vivo</span>` })}

      ${CONTROLES.map(([titulo, campos]) => painel(h(titulo), `
        <div class="grade-campos">
          ${campos.map(([chave, rot, min, max, passo]) => `
            <div class="campo">
              <label for="c-${chave}">${h(rot)}</label>
              <input type="range" id="r-${chave}" data-cfg="${chave}" min="${min}" max="${max}" step="${passo}" value="${CFG[chave]}">
              <input type="number" id="c-${chave}" data-cfg="${chave}" min="${min}" max="${max}" step="${passo}" value="${CFG[chave]}">
            </div>`).join("")}
        </div>
        ${titulo.startsWith("Pesos") ? `<div class="mudo" style="font-size:12.5px;margin-top:10px">
          Em uso após normalização: desempenho <b>${fmt(w[0] * 100, 0)}%</b> · evolução <b>${fmt(w[1] * 100, 0)}%</b> ·
          frequência <b>${fmt(w[2] * 100, 0)}%</b> · consistência <b>${fmt(w[3] * 100, 0)}%</b>.</div>` : ""}`)).join("")}

      ${painel("Efeito imediato", tabela(COLS_RANKING, M.ranking.map(r => linhaRanking(r))), {
        nu: true,
        direita: `<span class="tag tag--bom">${M.classes.evolucao} em evolução</span>
                  <span class="tag tag--medio">${M.classes.intermediario} intermediários</span>
                  <span class="tag tag--ruim">${M.classes.atencao} precisam de atenção</span>
                  <span class="tag tag--neutro">${M.alertas.length} alertas</span>` })}`,
    depois() {
      document.querySelectorAll("[data-cfg]").forEach(campo => {
        campo.addEventListener(campo.type === "range" ? "input" : "change", () => {
          const v = parseFloat(campo.value);
          if (Number.isNaN(v)) return;
          CFG[campo.dataset.cfg] = v;
          registrarAuditoria("alterou configuração", "sistema", campo.dataset.cfg + " = " + v);
          recalcular(); render();
          document.getElementById(campo.id)?.focus({ preventScroll: true });
        });
      });
      el("restaurar").addEventListener("click", () => { CFG = { ...PADROES }; recalcular(); render(); });
    },
  };
};

/* ---------------------------------------------------------------- auditoria */

  { quem: "Filipe Pereira", papel: "admin", acao: "cadastrou", entidade: "professor", detalhe: "Marina Alencar", quando: "2026-02-02 08:14" },
  { quem: "Filipe Pereira", papel: "admin", acao: "vinculou", entidade: "professor", detalhe: "INF01 — Informática", quando: "2026-02-02 08:16" },
  { quem: "Filipe Pereira", papel: "admin", acao: "cadastrou", entidade: "professor", detalhe: "Ricardo Menezes", quando: "2026-02-02 08:20" },
  { quem: "Marina Alencar", papel: "professor", acao: "registrou", entidade: "aula", detalhe: "Informática — aula 1", quando: "2026-02-09 19:05" },
  { quem: "Marina Alencar", papel: "professor", acao: "lançou resultados", entidade: "avaliacao", detalhe: "Avaliação diagnóstica", quando: "2026-02-17 21:40" },
  { quem: "Ricardo Menezes", papel: "professor", acao: "registrou chamada", entidade: "aula", detalhe: "Legislação (AGT01) — aula 1", quando: "2026-03-09 08:55" },
  { quem: "Marina Alencar", papel: "professor", acao: "abriu", entidade: "acompanhamento", detalhe: "Reforço em Segurança da Informação", quando: "2026-05-14 20:10" },
];
function registrarAuditoria(acao, entidade, detalhe) {
  const agora = new Date();
  AUDITORIA.unshift({
    quem: PERFIL.nome,
    papel: PERFIL.papel,
    acao, entidade, detalhe,
    quando: agora.toISOString().slice(0, 10) + " " + agora.toTimeString().slice(0, 5),
    novo: true,
  });
}

VISTAS.auditoria = () => ({
  html: `
    <div class="cabec">
      <div><h1>Auditoria</h1>
        <p>Só operações que alteram dados entram aqui — leitura não é registrada, para o log continuar legível.
           <strong>Experimente</strong>: lance um resultado ou mexa numa configuração e volte a esta tela.</p></div>
    </div>
    ${painel("Alterações", tabela(
      [{ t: "Quando" }, { t: "Quem" }, { t: "Perfil" }, { t: "Ação" }, { t: "Entidade" }, { t: "Detalhe" }],
      AUDITORIA.map(l => `<tr${l.novo ? ' style="background:var(--acento-sup)"' : ""}>
        <td class="mono nowrap">${h(l.quando)}</td>
        <td>${h(l.quem)}</td>
        <td>${tag("neutro", { admin: "Administrador", professor: "Professor", aluno: "Aluno" }[l.papel])}</td>
        <td>${h(l.acao)}</td>
        <td class="pequeno">${h(l.entidade)}</td>
        <td class="pequeno mudo">${h(l.detalhe ?? "")}</td></tr>`)),
      { nu: true, direita: `<span class="tag tag--neutro">${AUDITORIA.length} registro(s)</span>` })}`,
});

/* ===========================================================================
   8. RENDERIZAÇÃO E EVENTOS
   =========================================================================== */
const el = (id) => document.getElementById(id);

function render() {
  const janela = window.scrollY;
  const gradeAntes = document.querySelector(".grade-res");
  const rolagem = gradeAntes ? { x: gradeAntes.scrollLeft, y: gradeAntes.scrollTop } : null;

  if (!rota.vista || !VISTAS[rota.vista]) rota = { vista: rotaInicial(), id: null };
  const vista = VISTAS[rota.vista]();
  el("vista").innerHTML = vista.html;
  montarMenu();
  montarPerfil();
  vista.depois?.();

  const gradeDepois = document.querySelector(".grade-res");
  if (rolagem && gradeDepois) { gradeDepois.scrollLeft = rolagem.x; gradeDepois.scrollTop = rolagem.y; }
  window.scrollTo({ top: janela, behavior: "instant" });
}

function trocarPerfil(id) {
  PERFIL = PERFIS.find(p => p.id === id) || PERFIS[0];
  rota = { vista: rotaInicial(), id: null };
  recalcular();
  render();
  window.scrollTo({ top: 0, behavior: "instant" });
}

document.addEventListener("change", (ev) => {
  if (ev.target.id === "seletor-perfil") trocarPerfil(ev.target.value);
});

document.addEventListener("click", (ev) => {
  const alvo = (attr) => ev.target.closest(`[${attr}]`);
  let e;
  if ((e = alvo("data-ir")))          { ir(e.dataset.ir); return; }
  if ((e = alvo("data-aluno")))       { ir(PERFIL.papel === "professor" ? "aluno-professor" : "aluno", +e.dataset.aluno); return; }
  if ((e = alvo("data-alunoprof")))   { ir("aluno-professor", +e.dataset.alunoprof); return; }
  if ((e = alvo("data-aula")))        { ir("chamada", +e.dataset.aula); return; }
  if ((e = alvo("data-avaliacao")))   { ir("avaliacao", +e.dataset.avaliacao); return; }
  if ((e = alvo("data-turma")))       { ir("turma", +e.dataset.turma); return; }
  if ((e = alvo("data-disciplina")))  { ir("disciplina", +e.dataset.disciplina); return; }
  if ((e = alvo("data-professor")))   { ir("professor", +e.dataset.professor); return; }
  if ((e = alvo("data-acompanhar")))  { ir("acompanhamento-form", { aluno: +e.dataset.acompanhar, titulo: e.dataset.titulo }); return; }
  if ((e = alvo("data-oferta-painel"))) {
    const o = BASE.oferta(+e.dataset.ofertaPainel);
    rota = { vista: "meu-painel", id: null };
    recalcular({ turma: o.class_id, disciplina: o.subject_id });
    render(); return;
  }
  if ((e = alvo("data-oferta-aulas")))      { ir("aulas"); return; }
  if ((e = alvo("data-oferta-avaliacoes"))) { ir("avaliacoes"); return; }
  if ((e = alvo("data-ver-como"))) {
    const perfil = PERFIS.find(p => p.userId === +e.dataset.verComo);
    if (perfil) { document.getElementById("seletor-perfil").value = perfil.id; trocarPerfil(perfil.id); }
    return;
  }
});

let temporizador;
window.addEventListener("resize", () => { clearTimeout(temporizador); temporizador = setTimeout(render, 180); });

recalcular();
render();
</script>
