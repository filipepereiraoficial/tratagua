    </div>
    ${painel("Situação de cada aluno", `<div id="tab-alunos">${tabela(COLS_RANKING, M.ranking.map(r => linhaRanking(r, true)))}</div>`, { nu: true })}`,
  depois() {
    const campo = el("busca-aluno");
    campo.addEventListener("input", () => {
      const termo = campo.value.toLowerCase().trim();
      el("tab-alunos").innerHTML = tabela(COLS_RANKING,
        M.ranking.filter(r => r.aluno.full_name.toLowerCase().includes(termo)).map(r => linhaRanking(r, true)),
        { vazio: "Nenhum aluno corresponde ao filtro." });
    });
  },
});

/* ------------------------------------------- aluno: dashboard individual */
VISTAS.aluno = () => {
  const r = M.porAluno.get(rota.id);
  if (!r) return { html: '<div class="vazio">Aluno não encontrado.</div>' };
  const c = ROTULO_CLASSE[r.classificacao];
  const serieTurma = M.porAvaliacao;
  const labels = r.notas.map(n => n.aval.name);
  const alertasDele = M.alertas.filter(a => a.student_id === r.id);

  const mediaTurma = M.mediaGeral;
  const delta = r.media !== null && mediaTurma !== null ? r.media - mediaTurma : null;

  return {
    html: `
      <div class="cabec">
        <div style="display:flex;gap:12px;align-items:center">
          <span style="width:44px;height:44px;border-radius:50%;background:var(--acento-sup);color:var(--acento);
                       display:grid;place-items:center;font-weight:600;font-family:var(--display);font-size:15px">${h(iniciais(r.aluno.full_name))}</span>
          <div>
            <h1>${h(r.aluno.full_name)}</h1>
            <p><button class="migalha" data-ir="alunos">Alunos</button> · Turma ${h(DADOS.turma.code)} ·
               ${tag(c.classe, c.texto)} · posição <span class="mono">${r.posicao ?? "—"}</span> de ${M.ranking.filter(x => x.indice !== null).length}</p>
          </div>
        </div>
      </div>

      ${r.motivos.length ? `<div class="aviso"><b>Por quê?</b><div>${h(r.motivos.join(" "))}</div></div>` : ""}

      <div class="kpis">
        ${kpi("Média geral", pct(r.media), delta === null ? "" :
          `${delta >= 0 ? "▲" : "▼"} ${num(Math.abs(delta))} p.p. vs. turma (${pct(mediaTurma, 0)})`, faixa(r.media).classe)}
        ${kpi("% de acertos", pct(r.acertos.pct_acertos), `${r.acertos.acertos} de ${r.acertos.total} questões`, faixa(r.acertos.pct_acertos).classe)}
        ${kpi("% de erros", pct(r.acertos.pct_erros), `${r.acertos.branco} em branco`)}
        ${kpi("Avaliações", r.avaliacoes, `desvio de ${num(r.desvio)} p.p.`)}
        ${kpi("Evolução recente", r.evolucao_recente === null ? "—" : (r.evolucao_recente >= 0 ? "+" : "") + num(r.evolucao_recente),
          `tendência ${num(r.evolucao_slope, 2)} p.p./avaliação`, r.evolucao_recente === null ? "" : (r.evolucao_recente >= 0 ? "bom" : "ruim"))}
        ${kpi("Frequência", pct(r.frequencia), `${r.presenca.faltas} falta(s) em ${r.presenca.aulas} aula(s)`,
          r.frequencia === null ? "" : (r.frequencia >= CFG.frequencia_minima ? "bom" : "ruim"))}
        ${kpi("Conteúdos dominados", r.dominados, `${r.intermediarios} intermediário(s)`, "bom")}
        ${kpi("Com dificuldade", r.dificuldades, `abaixo de ${fmt(CFG.faixa_intermediario, 0)}%`, "ruim")}
        ${kpi("Índice de Desenvolvimento", num(r.indice), c.texto, "acento")}
      </div>

      ${painel("Como o Índice de Desenvolvimento deste aluno foi formado", grafico("g-contrib", 110),
        { direita: '<span class="tag tag--neutro">cada faixa é componente × peso</span>' })}

      <div class="colunas c-2">
        ${painel("Evolução das notas", grafico("g-ev"), { direita: '<span class="tag tag--info">aluno × turma</span>' })}
        ${painel("Acertos e erros por avaliação", grafico("g-ae"))}
      </div>
      <div class="colunas c-2">
        ${painel("Desempenho por assunto", grafico("g-as", 180))}
        ${painel("Desempenho por dificuldade", grafico("g-di", 120))}
      </div>

      <div class="colunas c-21">
        <div>
          ${painel("Mapa de conteúdos", tabela(
            [{ t: "Assunto" }, { t: "Questões", num: 1 }, { t: "Acertos", num: 1 }, { t: "Aproveitamento" }, { t: "Situação" }],
            r.assuntos.map(a => {
              const f = faixa(a.amostra_suficiente ? a.aproveitamento : null);
              return `<tr><td>${h(a.topic_name)}</td><td class="num">${a.respondidas}</td>
                <td class="num">${a.acertos}</td><td>${barra(a.aproveitamento)}</td>
                <td>${tag(f.classe, a.amostra_suficiente ? f.texto : "Amostra insuficiente")}</td></tr>`;
            }), { vazio: "Nenhuma resposta por questão registrada." }), { nu: true })}

          ${painel("Histórico de avaliações", tabela(
            [{ t: "Data" }, { t: "Avaliação" }, { t: "Tipo" }, { t: "Nota", num: 1 }, { t: "Aproveitamento", num: 1 }, { t: "C / E / B", num: 1 }],
            [...r.notas].reverse().map(n => `<tr class="linha-clicavel" data-avaliacao="${n.assessment_id}">
              <td class="mono">${dataBr(n.aval.assessment_date)}</td><td>${h(n.aval.name)}</td>
              <td class="mudo">${h(ROTULO_TIPO[n.aval.type])}</td>
              <td class="num mono">${num(n.score, 2)} / ${num(n.aval.max_score, 0)}</td>
              <td class="num">${tag(faixa(n.percentage).classe, pct(n.percentage, 0))}</td>
              <td class="num mono">${n.correct_count}/${n.wrong_count}/${n.blank_count}</td></tr>`)), { nu: true })}
        </div>
        <div>
          ${painel("Alertas deste aluno", listaAlertas(alertasDele), { nu: true })}
          ${painel("Presença", tabela(
            [{ t: "Data" }, { t: "Aula" }, { t: "Situação" }, { t: "Part.", num: 1 }],
            DADOS.presencas.filter(p => p.student_id === r.id).map(p => {
              const aula = BASE.aulaPorId.get(p.lesson_id);
              const cl = { presente: "bom", atraso: "medio", falta: "ruim", falta_justificada: "neutro" }[p.status];
              return `<tr><td class="mono">${dataBr(aula.lesson_date)}</td>
                <td style="font-size:12.5px">${h(aula.title)}</td>
                <td>${tag(cl, ROTULO_PRESENCA[p.status])}</td>
                <td class="num">${p.participation ?? "—"}</td></tr>`;
            })), { nu: true })}
        </div>
      </div>`,
    depois() {
      grafContribuicao(el("g-contrib"), r);
      const mapaTurma = new Map(serieTurma.map(a => [a.assessment_id, a.media]));
      grafLinha(el("g-ev"), {
        labels,
        series: [
          { nome: r.aluno.full_name.split(" ")[0], dados: r.percentuais },
          { nome: "Turma", dados: r.notas.map(n => mapaTurma.get(n.assessment_id) ?? null), cor: "var(--serie-c)" },
        ],
      });
      grafBarrasV(el("g-ae"), {
        labels,
        series: [
          { nome: "% de acertos", dados: r.notas.map(n => { const t = n.correct_count + n.wrong_count + n.blank_count; return t ? r2(n.correct_count / t * 100) : null; }), cor: "var(--bom)" },
          { nome: "% de erros", dados: r.notas.map(n => { const t = n.correct_count + n.wrong_count + n.blank_count; return t ? r2(n.wrong_count / t * 100) : null; }), cor: "var(--ruim)" },
        ],
      });
      grafBarrasH(el("g-as"), r.assuntos.map(a => ({ nome: a.topic_name, valor: a.aproveitamento, nota: `${a.respondidas} questões` })));
      const dif = BASE.aproveitamentoPorDificuldade(BASE.respostasDoAluno(r.id));
      grafBarrasH(el("g-di"), dif.map(x => ({ nome: ROTULO_DIFICULDADE[x.dificuldade], valor: x.aproveitamento, nota: `${x.respondidas} questões` })), { rotuloLargura: 110 });
    },
  };
};
</script>

<script>
/* ------------------------------------------------------- turma (painel) */
VISTAS.turmas = () => {
  const t = DADOS.turma;
  const freqTurma = (() => {
    const regs = DADOS.presencas;
    const conta = (s) => regs.filter(p => p.status === s).length;
    const base = CFG.justificada_conta ? regs.length : regs.length - conta("falta_justificada");
    return base > 0 ? r2((conta("presente") + conta("atraso") * 0.5) / base * 100) : null;
  })();

  return {
    html: `
      <div class="cabec">
        <div>
          <h1>Turma ${h(t.code)}</h1>
          <p>${h(DADOS.curso.name)} · ${t.year} · ${h(t.period)} ·
             ${dataBr(t.start_date)} a ${dataBr(t.end_date)} · ${tag("info", "Em andamento")}</p>
        </div>
        <div class="cabec__acoes"><button class="btn" data-ir="relatorios">Relatório da turma</button></div>
      </div>

      <div class="kpis">
        ${kpi("Média da turma", pct(M.mediaGeral), `${DADOS.alunos.length} alunos`, faixa(M.mediaGeral).classe)}
        ${kpi("% de acertos", pct(M.totais.pct_acertos), `${M.totais.total} respostas`, faixa(M.totais.pct_acertos).classe)}
        ${kpi("Frequência média", pct(freqTurma), `${DADOS.aulas.length} aulas registradas`,
          freqTurma !== null && freqTurma >= CFG.frequencia_minima ? "bom" : "medio")}
        ${kpi("Em evolução", M.classes.evolucao, "", "bom")}
        ${kpi("Intermediários", M.classes.intermediario, "", "medio")}
        ${kpi("Precisam de atenção", M.classes.atencao, "", "ruim")}
      </div>

      <div class="colunas c-2">
        ${painel("Evolução da turma", grafico("t-ev"))}
        ${painel("Assuntos ordenados pelo aproveitamento", grafico("t-as", 190))}
      </div>

      <div class="colunas c-21">
        <div>${painel("Alunos e Índice de Desenvolvimento",
          tabela(COLS_RANKING, M.ranking.map(r => linhaRanking(r))), { nu: true })}</div>
        <div>
          ${painel("Disciplinas da turma", `
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
              <div><strong>${h(DADOS.disciplina.name)}</strong>
                <div class="mudo" style="font-size:12px">${DADOS.aulas.length} aulas · ${DADOS.avaliacoes.length} avaliações · ${DADOS.disciplina.workload_hours}h</div></div>
              <button class="btn btn--min" data-ir="disciplinas">Abrir</button>
            </div>`)}
          ${painel("Alertas da turma", listaAlertas(M.alertas.filter(a => !a.student_id).concat(M.alertas.filter(a => a.student_id)), 8), { nu: true })}
        </div>
      </div>`,
    depois() {
      grafLinha(el("t-ev"), { labels: M.porAvaliacao.map(a => a.nome), series: [{ nome: "Média da turma", dados: M.porAvaliacao.map(a => a.media) }] });
      grafBarrasH(el("t-as"), M.assuntos.map(a => ({ nome: a.topic_name, valor: a.aproveitamento, nota: `${a.alunos} alunos · ${a.respondidas} respostas` })));
    },
  };
};

/* ------------------------------------------------------------ disciplina */
VISTAS.disciplinas = () => {
  const d = DADOS.disciplina;
  const raizes = DADOS.topicos.filter(t => t.parent_id === null);
  const porAssunto = new Map(M.assuntos.map(a => [a.topic_id, a]));

  return {
    html: `
      <div class="cabec">
        <div><h1>${h(d.name)}</h1>
          <p>${h(d.description)} · ${d.workload_hours}h · ${raizes.length} assuntos ·
             ${DADOS.topicos.length - raizes.length} tópicos · ${DADOS.questoes.length} questões</p></div>
      </div>

      <div class="kpis">
        ${kpi("Média da disciplina", pct(M.mediaGeral), "", faixa(M.mediaGeral).classe)}
        ${kpi("% de acertos", pct(M.totais.pct_acertos), `${M.totais.total} respostas`, faixa(M.totais.pct_acertos).classe)}
        ${kpi("Assuntos mapeados", raizes.length, "com aproveitamento medido")}
        ${kpi("Aulas / Avaliações", `${DADOS.aulas.length} / ${DADOS.avaliacoes.length}`, "na turma INF01")}
      </div>

      <div class="colunas c-2">
        ${painel("Aproveitamento por assunto", grafico("d-as", 190))}
        ${painel("Aproveitamento por dificuldade", grafico("d-di", 130))}
      </div>

      ${painel("Assuntos e tópicos", `
        <div style="display:grid;gap:10px">
          ${raizes.map(raiz => {
            const stat = porAssunto.get(raiz.id);
            const filhos = DADOS.topicos.filter(t => t.parent_id === raiz.id);
            const f = faixa(stat?.aproveitamento ?? null);
            return `<div style="border:1px solid var(--fio);border-radius:var(--r-s);padding:10px 12px">
              <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
                <strong>${h(raiz.name)}</strong>
                ${tag("info", "assunto")}
                <span style="margin-left:auto;min-width:150px">${barra(stat?.aproveitamento ?? null)}</span>
                ${tag(f.classe, f.texto)}
              </div>
              <div class="mudo" style="font-size:12px;margin-top:5px">
                ${filhos.map(t => h(t.name)).join(" · ")}
              </div>
            </div>`;
          }).join("")}
        </div>`)}`,
    depois() {
      grafBarrasH(el("d-as"), M.assuntos.map(a => ({ nome: a.topic_name, valor: a.aproveitamento, nota: `${a.respondidas} respostas` })));
      grafBarrasH(el("d-di"), M.dificuldade.map(x => ({ nome: ROTULO_DIFICULDADE[x.dificuldade], valor: x.aproveitamento, nota: `${x.respondidas} questões` })), { rotuloLargura: 110 });
    },
  };
};

/* ----------------------------------------------------------------- aulas */
VISTAS.aulas = () => ({
  html: `
    <div class="cabec">
      <div><h1>Aulas</h1><p>Histórico da disciplina Informática na turma INF01. Abra a chamada para ver — e alterar — a frequência.</p></div>
    </div>
    ${painel("Aulas registradas", tabela(
      [{ t: "Data" }, { t: "Aula" }, { t: "Tópicos" }, { t: "Duração", num: 1 }, { t: "Chamada" }, { t: "" }],
      DADOS.aulas.map(a => {
        const regs = DADOS.presencas.filter(p => p.lesson_id === a.id);
        const presentes = regs.filter(p => p.status === "presente" || p.status === "atraso").length;
        const tops = DADOS.aula_topicos.filter(t => t.lesson_id === a.id)
          .map(t => BASE.topicoPorId.get(t.topic_id)?.name).filter(Boolean);
        return `<tr class="linha-clicavel" data-aula="${a.id}">
          <td class="mono">${dataBr(a.lesson_date)}</td>
          <td><strong>${h(a.title)}</strong><div class="mudo" style="font-size:11.5px">${h(a.content)}</div></td>
          <td class="mudo" style="font-size:12px">${h(tops.join(" · ")) || "—"}</td>
          <td class="num">${a.duration_minutes} min</td>
          <td>${tag(presentes === regs.length ? "bom" : "medio", `${presentes}/${regs.length} presentes`)}</td>
          <td class="num"><span class="btn btn--min">Chamada</span></td></tr>`;
      })), { nu: true })}`,
});

/* -------------------------------------------------------------- chamada */
VISTAS.chamada = () => {
  const aula = BASE.aulaPorId.get(rota.id);
  if (!aula) return { html: '<div class="vazio">Aula não encontrada.</div>' };
  const opcoes = [["presente", "Presente"], ["atraso", "Atraso"], ["falta", "Falta"], ["falta_justificada", "Justificada"]];

  return {
    html: `
      <div class="cabec">
        <div><h1>Chamada</h1>
          <p><button class="migalha" data-ir="aulas">Aulas</button> · <strong>${h(aula.title)}</strong> ·
             ${dataBr(aula.lesson_date)} · ${aula.duration_minutes} min</p></div>
      </div>
      <div class="aviso"><b>Interativo</b><div>Troque a situação de um aluno: a frequência, o Índice de
        Desenvolvimento, o ranking e os alertas são recalculados na hora — como no sistema real.</div></div>
      ${painel(`${DADOS.alunos.length} alunos`, tabela(
        [{ t: "Aluno" }, { t: "Situação" }, { t: "Participação", num: 1 }, { t: "Frequência acumulada", num: 1 }],
        DADOS.alunos.map(al => {
          const p = DADOS.presencas.find(x => x.lesson_id === aula.id && x.student_id === al.id);
          const r = M.porAluno.get(al.id);
          return `<tr>
            <td>${h(al.full_name)}</td>
            <td><select data-presenca="${al.id}" style="padding:4px 6px;border-radius:5px;border:1px solid var(--fio-forte);background:var(--elevado);color:var(--tinta);font:inherit;font-size:12.5px">
              ${opcoes.map(([v, t]) => `<option value="${v}" ${p?.status === v ? "selected" : ""}>${t}</option>`).join("")}
            </select></td>
            <td class="num mono">${p?.participation ?? "—"}</td>
            <td class="num">${tag(r.frequencia >= CFG.frequencia_minima ? "bom" : "ruim", pct(r.frequencia, 1))}</td>
          </tr>`;
        })), { nu: true })}`,
    depois() {
      document.querySelectorAll("[data-presenca]").forEach(sel => {
        sel.addEventListener("change", () => {
          const id = Number(sel.dataset.presenca);
          const reg = DADOS.presencas.find(x => x.lesson_id === aula.id && x.student_id === id);
          if (reg) reg.status = sel.value;
          recalcular(); render();
        });
      });
    },
  };
};

/* ----------------------------------------------------------- avaliações */
VISTAS.avaliacoes = () => ({
  html: `
    <div class="cabec">
      <div><h1>Avaliações</h1><p>Abra uma avaliação para ver a análise item a item e lançar resultados por questão.</p></div>
    </div>
    ${painel("Avaliações da turma", tabela(
      [{ t: "Data" }, { t: "Avaliação" }, { t: "Tipo" }, { t: "Peso", num: 1 }, { t: "Questões", num: 1 },
       { t: "Lançados", num: 1 }, { t: "Média", num: 1 }, { t: "" }],
      M.porAvaliacao.map(a => {
        const av = BASE.avaliacaoPorId.get(a.assessment_id);
        const qs = DADOS.questoes.filter(q => q.assessment_id === av.id).length;
        return `<tr class="linha-clicavel" data-avaliacao="${av.id}">
          <td class="mono">${dataBr(av.assessment_date)}</td>
          <td><strong>${h(av.name)}</strong></td>
          <td class="mudo">${h(ROTULO_TIPO[av.type])}</td>
          <td class="num mono">${num(av.weight, 1)}</td>
          <td class="num">${qs}</td>
          <td class="num">${a.alunos}</td>
          <td class="num">${tag(faixa(a.media).classe, pct(a.media, 1))}</td>
          <td class="num"><span class="btn btn--min">Resultados</span></td></tr>`;
      })), { nu: true })}`,
});

/* ------------------------------- avaliação: análise + lançamento por questão */
VISTAS.avaliacao = () => {
  const av = BASE.avaliacaoPorId.get(rota.id);
  if (!av) return { html: '<div class="vazio">Avaliação não encontrada.</div>' };
  const questoes = BASE.analiseDaAvaliacao(av.id, CFG);
  const notas = DADOS.notas.filter(n => n.assessment_id === av.id);
  const p = notas.map(n => n.percentage);
  const media = p.length ? r2(p.reduce((a, b) => a + b, 0) / p.length) : null;
  const respostasAv = DADOS.respostas.filter(r => questoes.some(q => q.id === r.question_id));
  const assuntosAv = BASE.aproveitamentoPorAssunto(respostasAv, CFG);
  const totaisAv = BASE.totaisDeResposta(respostasAv);

  const matriz = new Map();
  for (const r of respostasAv) matriz.set(r.student_id + ":" + r.question_id, r);

  return {
    html: `
      <div class="cabec">
        <div><h1>${h(av.name)}</h1>
          <p><button class="migalha" data-ir="avaliacoes">Avaliações</button> ·
             ${h(ROTULO_TIPO[av.type])} · ${dataBr(av.assessment_date)} ·
             valor ${num(av.max_score, 0)} · peso ${num(av.weight, 1)}</p></div>
      </div>

      <div class="kpis">
        ${kpi("Média", pct(media), `${notas.length} alunos com resultado`, faixa(media).classe)}
        ${kpi("Menor / Maior", `${pct(p.length ? Math.min(...p) : null, 0)} / ${pct(p.length ? Math.max(...p) : null, 0)}`,
          `desvio de ${num(desvioPadrao(p))} p.p.`)}
        ${kpi("% de acertos", pct(totaisAv.pct_acertos), `${totaisAv.branco} em branco`, faixa(totaisAv.pct_acertos).classe)}
        ${kpi("Questões", questoes.length, `somando ${num(questoes.reduce((a, q) => a + q.points, 0), 2)} pontos`)}
      </div>

      <div class="colunas c-2">
        ${painel("Índice de acerto por questão", grafico("a-q", 250))}
        ${painel("Aproveitamento por assunto nesta prova", grafico("a-as", 190))}
      </div>

      <div class="aviso"><b>Interativo</b><div>Clique em <b>C</b>, <b>E</b> ou <b>N</b> para lançar o resultado de
        um aluno em uma questão. A nota, o percentual, o mapa de conteúdos, o ranking e os alertas são recalculados
        imediatamente — é o mesmo cálculo que o servidor faz ao salvar.</div></div>

      ${painel("Resultados por questão", `<div class="grade-res">
        <table>
          <thead><tr><th>Aluno</th>
            ${questoes.map(q => `<th class="num" title="${h(q.assunto || "sem assunto")} · ${h(ROTULO_DIFICULDADE[q.difficulty])} · ${num(q.points, 2)} pt">${q.number}</th>`).join("")}
            <th class="num">Nota</th></tr></thead>
          <tbody>
            ${DADOS.alunos.map(al => {
              const nota = notas.find(n => n.student_id === al.id);
              return `<tr><th>${h(al.full_name)}</th>
                ${questoes.map(q => {
                  const r = matriz.get(al.id + ":" + q.id);
                  const marca = (v, rot) => `<button class="${v[0]}" data-marca="${al.id}|${q.id}|${v}"
                    aria-pressed="${r?.result === v}" title="${rot}">${rot[0]}</button>`;
                  return `<td><div class="marcas">${marca("correta", "Certo")}${marca("incorreta", "Errado")}${marca("nao_respondida", "Não respondeu")}</div></td>`;
                }).join("")}
                <td class="num mono">${nota ? `<strong>${num(nota.score, 2)}</strong><br><span class="tag tag--${faixa(nota.percentage).classe}">${pct(nota.percentage, 0)}</span>` : "—"}</td>
              </tr>`;
            }).join("")}
          </tbody>
        </table></div>`, { nu: true, direita: '<span class="tag tag--neutro">C = certo · E = errado · N = não respondeu</span>' })}

      ${painel("Detalhe das questões", tabela(
        [{ t: "#", num: 1 }, { t: "Assunto" }, { t: "Dificuldade" }, { t: "Pontos", num: 1 },
         { t: "C / E / B", num: 1 }, { t: "Índice de acerto" }],
        questoes.map(q => `<tr>
          <td class="num mono">${q.number}</td>
          <td>${h(q.assunto || "—")}</td>
          <td>${tag({ facil: "bom", medio: "medio", dificil: "ruim" }[q.difficulty], ROTULO_DIFICULDADE[q.difficulty])}</td>
          <td class="num mono">${num(q.points, 2)}</td>
          <td class="num mono">${q.acertos}/${q.erros}/${q.branco}</td>
          <td>${barra(q.indice_acerto)}</td></tr>`)), { nu: true })}`,
    depois() {
      grafBarrasV(el("a-q"), {
        labels: questoes.map(q => "Q" + q.number),
        series: [{ nome: "Índice de acerto", dados: questoes.map(q => q.indice_acerto),
                   cores: questoes.map(q => faixa(q.indice_acerto).cor) }],
      });
      grafBarrasH(el("a-as"), assuntosAv.map(a => ({ nome: a.topic_name, valor: a.aproveitamento, nota: `${a.respondidas} respostas` })));

      document.querySelectorAll("[data-marca]").forEach(b => {
        b.addEventListener("click", () => {
          const [alunoId, questaoId, valor] = b.dataset.marca.split("|");
          const q = BASE.questaoPorId.get(Number(questaoId));
          let r = DADOS.respostas.find(x => x.student_id === +alunoId && x.question_id === +questaoId);
          if (!r) { r = { question_id: +questaoId, student_id: +alunoId, result: valor, score_earned: 0 }; DADOS.respostas.push(r); }
          r.result = valor;
          r.score_earned = valor === "correta" ? q.points : 0;
          recalcularNota(av.id, +alunoId);
          recalcular(); render();
        });
      });
    },
  };
};

/* -------------------------------------------------------------- questões */
VISTAS.questoes = () => {
  const linhas = DADOS.questoes.map(q => {
    const resp = DADOS.respostas.filter(r => r.question_id === q.id);
    const acertos = resp.filter(r => r.result === "correta").length;
    const raiz = q.topic_id ? BASE.raiz(q.topic_id) : null;
    const filho = q.topic_id ? BASE.topicoPorId.get(q.topic_id) : null;
    return { q, raiz, filho, respondidas: resp.length, acertos,
             indice: resp.length ? r2(acertos / resp.length * 100) : null,
             avaliacao: BASE.avaliacaoPorId.get(q.assessment_id) };
  });

  return {
    html: `
      <div class="cabec">
        <div><h1>Banco de questões</h1>
          <p>${DADOS.questoes.length} questões classificadas por assunto e dificuldade, com o índice de acerto real.
             É essa classificação que permite dizer <em>em que</em> o aluno tem dificuldade.</p></div>
        <div class="cabec__acoes">
          <select id="f-dif" class="busca" aria-label="Filtrar por dificuldade">
            <option value="">Todas as dificuldades</option>
            <option value="facil">Fácil</option><option value="medio">Médio</option><option value="dificil">Difícil</option>
          </select>
        </div>
      </div>
      ${painel("Questões", `<div id="tab-q"></div>`, { nu: true })}`,
    depois() {
      const desenhar = () => {
        const dif = el("f-dif").value;
        const filtradas = linhas.filter(l => !dif || l.q.difficulty === dif);
        el("tab-q").innerHTML = tabela(
          [{ t: "Avaliação" }, { t: "#", num: 1 }, { t: "Assunto / tópico" }, { t: "Dificuldade" },
           { t: "Pontos", num: 1 }, { t: "Gabarito" }, { t: "Índice de acerto" }],
          filtradas.map(l => `<tr>
            <td style="font-size:12.5px">${h(l.avaliacao.name)}<div class="mudo mono" style="font-size:11px">${dataBr(l.avaliacao.assessment_date)}</div></td>
            <td class="num mono">${l.q.number}</td>
            <td>${h(l.raiz?.name ?? "—")}<div class="mudo" style="font-size:11.5px">${h(l.filho && l.filho.id !== l.raiz?.id ? l.filho.name : "")}</div></td>
            <td>${tag({ facil: "bom", medio: "medio", dificil: "ruim" }[l.q.difficulty], ROTULO_DIFICULDADE[l.q.difficulty])}</td>
            <td class="num mono">${num(l.q.points, 2)}</td>
            <td class="mono">${h(l.q.answer_key ?? "—")}</td>
            <td>${barra(l.indice)}<div class="mudo" style="font-size:11px">${l.respondidas} respostas</div></td>
          </tr>`), { vazio: "Nenhuma questão nesse filtro." });
      };
      el("f-dif").addEventListener("change", desenhar);
      desenhar();
    },
  };
};
</script>

<script>
/* ------------------------------------------------------------ relatórios */
const RELATORIOS = {
  turma: () => ({
    titulo: "Desempenho da turma",
    colunas: ["Posição", "Aluno", "Avaliações", "Média", "% acertos", "Frequência", "Evolução (p.p.)", "Índice", "Classificação"],
    linhas: M.ranking.map(r => [r.posicao ?? "—", r.aluno.full_name, r.avaliacoes,
      { v: r.media }, { v: r.acertos.pct_acertos }, { v: r.frequencia }, num(r.evolucao_recente),
      num(r.indice), ROTULO_CLASSE[r.classificacao].texto]),
    resumo: { "Alunos": M.ranking.length, "Média geral": pct(M.mediaGeral),
      "Em evolução": M.classes.evolucao, "Intermediários": M.classes.intermediario, "Precisam de atenção": M.classes.atencao },
  }),
  aluno: () => {
    const r = M.ranking[0];
    return {
      titulo: `Relatório individual — ${r.aluno.full_name}`,
      nota: "No sistema instalado, escolha o aluno no filtro. Aqui a demonstração mostra o primeiro do ranking.",
      colunas: ["Data", "Avaliação", "Tipo", "Nota", "Valor máximo", "Aproveitamento", "Acertos", "Erros", "Em branco"],
      linhas: r.notas.map(n => [dataBr(n.aval.assessment_date), n.aval.name, ROTULO_TIPO[n.aval.type],
        num(n.score, 2), num(n.aval.max_score, 0), { v: n.percentage }, n.correct_count, n.wrong_count, n.blank_count]),
      resumo: { "Turma": DADOS.turma.code, "Avaliações realizadas": r.avaliacoes, "Média geral": pct(r.media),
        "Frequência": pct(r.frequencia), "Evolução recente": num(r.evolucao_recente) + " p.p.",
        "Índice de Desenvolvimento": num(r.indice), "Classificação": ROTULO_CLASSE[r.classificacao].texto,
        "Conteúdos dominados": r.dominados, "Conteúdos com dificuldade": r.dificuldades },
    };
  },
  disciplina: () => ({
    titulo: "Desempenho por disciplina",
    colunas: ["Disciplina", "Alunos", "Avaliações", "Lançamentos", "Média", "% acertos", "% erros"],
    linhas: [[DADOS.disciplina.name, DADOS.alunos.length, DADOS.avaliacoes.length, DADOS.notas.length,
      { v: M.mediaGeral }, { v: M.totais.pct_acertos }, { v: M.totais.pct_erros }]],
  }),
  avaliacao: () => ({
    titulo: "Desempenho por avaliação",
    colunas: ["Data", "Avaliação", "Tipo", "Alunos", "Média", "Menor", "Maior"],
    linhas: M.porAvaliacao.map(a => {
      const av = BASE.avaliacaoPorId.get(a.assessment_id);
      return [dataBr(a.data), a.nome, ROTULO_TIPO[av.type], a.alunos, { v: a.media }, { v: a.minima }, { v: a.maxima }];
    }),
  }),
  assunto: () => ({
    titulo: "Desempenho por assunto",
    colunas: ["Assunto", "Alunos", "Questões respondidas", "Acertos", "Erros", "Aproveitamento", "Situação"],
    linhas: [...M.assuntos].reverse().map(a => [a.topic_name, a.alunos, a.respondidas, a.acertos, a.erros,
      { v: a.aproveitamento }, faixa(a.amostra_suficiente ? a.aproveitamento : null).texto]),
  }),
  dificuldade: () => {
    const criticos = M.assuntos.filter(a => a.aproveitamento !== null && a.aproveitamento < CFG.limite_dificuldade);
    return {
      titulo: `Dificuldades (aproveitamento abaixo de ${fmt(CFG.limite_dificuldade, 0)}%)`,
      colunas: ["Assunto", "Aproveitamento", "Alunos", "Questões respondidas", "Erros", "Amostra"],
      linhas: criticos.map(a => [a.topic_name, { v: a.aproveitamento }, a.alunos, a.respondidas, a.erros,
        a.amostra_suficiente ? "Suficiente" : "Insuficiente"]),
      vazio: "Nenhum assunto ficou abaixo do limite configurado.",
    };
  },
  evolucao: () => ({
    titulo: "Evolução dos alunos",
    colunas: ["Aluno", "Avaliações", "Primeira nota", "Última nota", "Tendência (p.p./aval.)", "Evolução recente", "Consistência", "Classificação"],
    linhas: [...M.ranking].sort((a, b) => (b.evolucao_recente ?? -999) - (a.evolucao_recente ?? -999))
      .map(r => [r.aluno.full_name, r.avaliacoes,
        { v: r.percentuais[0] ?? null }, { v: r.percentuais[r.percentuais.length - 1] ?? null },
        num(r.evolucao_slope, 2), num(r.evolucao_recente), num(r.score_consistencia),
        ROTULO_CLASSE[r.classificacao].texto]),
  }),
  frequencia: () => ({
    titulo: "Frequência",
    colunas: ["Aluno", "Aulas", "Presenças", "Atrasos", "Faltas", "Justificadas", "Frequência", "Participação", "Situação"],
    linhas: M.ranking.map(r => [r.aluno.full_name, r.presenca.aulas, r.presenca.presentes, r.presenca.atrasos,
      r.presenca.faltas, r.presenca.justificadas, { v: r.frequencia }, num(r.participacao, 1),
      r.frequencia === null ? "Sem aulas" : (r.frequencia < CFG.frequencia_minima ? "Abaixo do mínimo" : "Regular")]),
  }),
};
const NOMES_RELATORIO = {
  aluno: "Individual do aluno", turma: "Desempenho da turma", disciplina: "Por disciplina",
  avaliacao: "Por avaliação", assunto: "Por assunto", dificuldade: "Dificuldades",
  evolucao: "Evolução", frequencia: "Frequência",
};

VISTAS.relatorios = () => {
  const tipo = rota.id && RELATORIOS[rota.id] ? rota.id : "turma";
  const rel = RELATORIOS[tipo]();
  // Uma coluna é numérica quando a primeira linha traz número, percentual
  // embrulhado ou texto que é só dígitos — nunca por posição.
  const numerica = (i) => {
    const c = rel.linhas[0]?.[i];
    if (c === undefined) return false;
    if (typeof c === "object" && c !== null) return true;
    if (typeof c === "number") return true;
    return /^[-+]?[\d.,]+$/.test(String(c).trim());
  };
  const celula = (c) => typeof c === "object" && c !== null
    ? (c.v === null || c.v === undefined ? '<span class="mudo">—</span>' : tag(faixa(c.v).classe, pct(c.v, 1)))
    : h(c);

  return {
    html: `
      <div class="cabec">
        <div><h1>Relatórios</h1>
          <p>Curso Preparatório para Guarda Municipal · Turma INF01 · todos os registros.
             No sistema instalado, cada relatório aceita filtros por curso, turma, disciplina, aluno, assunto,
             período e dificuldade, exporta CSV e tem versão para impressão em PDF.</p></div>
      </div>

      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px">
        ${Object.keys(RELATORIOS).map(k =>
          `<button class="btn ${k === tipo ? "btn--forte" : ""}" data-rel="${k}">${h(NOMES_RELATORIO[k])}</button>`).join("")}
      </div>

      ${rel.resumo ? `<div class="kpis">${Object.entries(rel.resumo).map(([k, v]) => kpi(k, `<span style="font-size:18px">${h(String(v))}</span>`)).join("")}</div>` : ""}
      ${rel.nota ? `<div class="aviso"><b>Nota</b><div>${h(rel.nota)}</div></div>` : ""}

      ${painel(h(rel.titulo), tabela(
        rel.colunas.map((c, i) => ({ t: c, num: numerica(i) })),
        rel.linhas.map(l => `<tr>${l.map((c, i) => `<td class="${numerica(i) ? "num" : ""}">${celula(c)}</td>`).join("")}</tr>`),
        { vazio: rel.vazio || "Sem dados." }),
        { nu: true, direita: `<span class="tag tag--neutro">${rel.linhas.length} linha(s)</span>` })}`,
    depois() {
      document.querySelectorAll("[data-rel]").forEach(b =>
        b.addEventListener("click", () => ir("relatorios", b.dataset.rel)));
    },
  };
};

/* ---------------------------------------------------------------- gráficos */
VISTAS.graficos = () => {
  const a = rota.id?.a ?? M.ranking[0].id;
  const b = rota.id?.b ?? M.ranking[M.ranking.length - 1].id;
  const ra = M.porAluno.get(a), rb = M.porAluno.get(b);
  const rotulos = M.porAvaliacao.map(x => x.nome);
  const alinhar = (r) => M.porAvaliacao.map(x => r.notas.find(n => n.assessment_id === x.assessment_id)?.percentage ?? null);

  return {
    html: `
      <div class="cabec">
        <div><h1>Gráficos e comparações</h1>
          <p>Todos os gráficos saem dos mesmos dados; a comparação aceita aluno × aluno, aluno × turma,
             turma × turma, disciplina × disciplina e avaliação × avaliação no sistema instalado.</p></div>
      </div>

      ${painel("Comparação entre alunos", `
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">
          <div class="campo"><label for="cmp-a">Primeiro aluno</label>
            <select id="cmp-a" class="busca">${M.ranking.map(r => `<option value="${r.id}" ${r.id === a ? "selected" : ""}>${h(r.aluno.full_name)}</option>`).join("")}</select></div>
          <div class="campo"><label for="cmp-b">Segundo aluno</label>
            <select id="cmp-b" class="busca">${M.ranking.map(r => `<option value="${r.id}" ${r.id === b ? "selected" : ""}>${h(r.aluno.full_name)}</option>`).join("")}</select></div>
        </div>
        ${grafico("g-cmp")}
        <div class="colunas c-2" style="margin-top:12px">
          ${[ra, rb].map((r, i) => `
            <div style="border:1px solid var(--fio);border-radius:var(--r-s);padding:10px 12px">
              <div style="display:flex;align-items:center;gap:7px">
                <i style="width:10px;height:10px;border-radius:2px;display:inline-block;background:${i ? "var(--serie-b)" : "var(--serie-a)"}"></i>
                <strong>${h(r.aluno.full_name)}</strong></div>
              <div class="mudo" style="font-size:12.5px;margin-top:4px">
                Média ${pct(r.media)} · Frequência ${pct(r.frequencia, 0)} ·
                Evolução ${num(r.evolucao_recente)} p.p. · Índice ${num(r.indice)}</div>
            </div>`).join("")}
        </div>
        <div class="aviso" style="margin:12px 0 0">
          <b>Diferença</b><div>${h(ra.aluno.full_name)} está
          ${ra.media >= rb.media ? "<b>acima</b>" : "<b>abaixo</b>"} de ${h(rb.aluno.full_name)} em
          <b>${num(Math.abs((ra.media ?? 0) - (rb.media ?? 0)))} p.p.</b> de média.</div>
        </div>`)}

      <div class="colunas c-2">
        ${painel("Evolução geral", grafico("gg-ev"))}
        ${painel("Média por avaliação", grafico("gg-av"))}
      </div>
      <div class="colunas c-2">
        ${painel("Melhores assuntos", grafico("gg-melhor", 190))}
        ${painel("Assuntos mais críticos", grafico("gg-pior", 190))}
      </div>
      ${painel("Frequência por aluno", grafico("gg-freq", 190))}`,
    depois() {
      const desenharCmp = () => {
        const x = M.porAluno.get(+el("cmp-a").value), y = M.porAluno.get(+el("cmp-b").value);
        grafLinha(el("g-cmp"), { labels: rotulos, series: [
          { nome: x.aluno.full_name.split(" ")[0], dados: alinhar(x) },
          { nome: y.aluno.full_name.split(" ")[0], dados: alinhar(y), cor: "var(--serie-b)" },
        ]});
      };
      el("cmp-a").addEventListener("change", () => ir("graficos", { a: +el("cmp-a").value, b: +el("cmp-b").value }));
      el("cmp-b").addEventListener("change", () => ir("graficos", { a: +el("cmp-a").value, b: +el("cmp-b").value }));
      desenharCmp();

      grafLinha(el("gg-ev"), { labels: rotulos, series: [{ nome: "Média da turma", dados: M.porAvaliacao.map(x => x.media) }] });
      grafBarrasV(el("gg-av"), { labels: rotulos, series: [{ nome: "Média (%)", dados: M.porAvaliacao.map(x => x.media),
        cores: M.porAvaliacao.map(x => faixa(x.media).cor) }] });
      const ord = [...M.assuntos].sort((p, q) => (q.aproveitamento ?? 0) - (p.aproveitamento ?? 0));
      grafBarrasH(el("gg-melhor"), ord.slice(0, 4).map(x => ({ nome: x.topic_name, valor: x.aproveitamento })));
      grafBarrasH(el("gg-pior"), ord.slice(-4).reverse().map(x => ({ nome: x.topic_name, valor: x.aproveitamento })));
      grafBarrasH(el("gg-freq"), M.ranking.map(r => ({ nome: r.aluno.full_name, valor: r.frequencia,
        cor: r.frequencia >= CFG.frequencia_minima ? "var(--bom)" : "var(--ruim)" })));
    },
  };
};

/* ----------------------------------------------------------- configurações */
const CONTROLES = [
  ["Faixas de classificação", [
    ["faixa_dominio", "Domínio a partir de (%)", 1, 100, 1],
    ["faixa_intermediario", "Intermediário a partir de (%)", 0, 99, 1],
    ["min_questoes_assunto", "Mínimo de questões por assunto", 1, 20, 1],
  ]],
  ["Pesos do Índice de Desenvolvimento", [
    ["peso_desempenho", "Desempenho", 0, 1, .05],
    ["peso_evolucao", "Evolução", 0, 1, .05],
    ["peso_frequencia", "Frequência", 0, 1, .05],
    ["peso_consistencia", "Consistência", 0, 1, .05],
    ["id_evolucao", "Corte “em evolução” (índice ≥)", 1, 100, 1],
    ["id_atencao", "Corte “precisa de atenção” (índice <)", 0, 99, 1],
  ]],
  ["Alertas e frequência", [
    ["frequencia_minima", "Frequência mínima (%)", 0, 100, 1],
    ["media_alerta", "Alerta de média abaixo de (%)", 0, 100, 1],
    ["queda_alerta", "Alerta de queda (p.p.)", 1, 40, 1],
    ["evolucao_alerta", "Destaque de evolução (p.p.)", 1, 40, 1],
    ["limite_dificuldade", "Limite de dificuldade (%)", 0, 100, 1],
    ["ocorrencias_persistente", "Ocorrências para dificuldade persistente", 2, 8, 1],
  ]],
];

VISTAS.config = () => {
  const w = (() => { const s = CFG.peso_desempenho + CFG.peso_evolucao + CFG.peso_frequencia + CFG.peso_consistencia;
    return s > 0 ? [CFG.peso_desempenho / s, CFG.peso_evolucao / s, CFG.peso_frequencia / s, CFG.peso_consistencia / s] : [.4, .25, .15, .2]; })();

  return {
    html: `
      <div class="cabec">
        <div><h1>Configurações</h1>
          <p>Estes são os critérios que produzem toda a análise. Mexa neles e veja a turma inteira
             ser reclassificada na hora — é exatamente o que o item “critérios configuráveis” pede.</p></div>
        <div class="cabec__acoes"><button class="btn" id="restaurar">Restaurar padrões</button></div>
      </div>

      ${painel("Régua de faixas", `
        <div class="regua">
          <div class="regua__t">
            <div class="regua__f regua__f--ruim" style="width:${CFG.faixa_intermediario}%">Dificuldade</div>
            <div class="regua__f regua__f--medio" style="width:${Math.max(0, CFG.faixa_dominio - CFG.faixa_intermediario)}%">Intermediário</div>
            <div class="regua__f regua__f--bom" style="width:${Math.max(0, 100 - CFG.faixa_dominio)}%">Domínio</div>
          </div>
          <div class="regua__marcas"><span>0%</span>
            <span>corte ${fmt(CFG.faixa_intermediario, 0)}% · ${fmt(CFG.faixa_dominio, 0)}%</span><span>100%</span></div>

          <div class="regua__assuntos">
            ${M.assuntos.map(a => {
              const f = faixa(a.aproveitamento);
              return `<div class="regua__linha">
                <span>${h(a.topic_name)}</span>
                <span class="regua__pista"><span class="regua__valor" style="width:${a.aproveitamento ?? 0}%;background:${f.cor}"></span></span>
                <span style="display:flex;gap:6px;align-items:center;justify-content:flex-end">
                  <span class="mono" style="font-size:12px">${pct(a.aproveitamento, 0)}</span>${tag(f.classe, f.texto)}</span>
              </div>`;
            }).join("")}
          </div>
        </div>`, { direita: '<span class="tag tag--neutro">os 6 assuntos, reclassificados ao vivo</span>' })}

      ${CONTROLES.map(([titulo, campos]) => painel(h(titulo), `
        <div class="grade-campos">
          ${campos.map(([chave, rot, min, max, passo]) => `
            <div class="campo">
              <label for="c-${chave}">${h(rot)}</label>
              <input type="range" id="r-${chave}" data-cfg="${chave}" min="${min}" max="${max}" step="${passo}" value="${CFG[chave]}">
              <input type="number" id="c-${chave}" data-cfg="${chave}" min="${min}" max="${max}" step="${passo}" value="${CFG[chave]}">
            </div>`).join("")}
        </div>
        ${titulo.startsWith("Pesos") ? `<div class="mudo" style="font-size:12.5px;margin-top:10px">
          Em uso após normalização: desempenho <b>${fmt(w[0] * 100, 0)}%</b> · evolução <b>${fmt(w[1] * 100, 0)}%</b> ·
          frequência <b>${fmt(w[2] * 100, 0)}%</b> · consistência <b>${fmt(w[3] * 100, 0)}%</b>.
          Se a soma não for 1, o sistema normaliza sozinho.</div>` : ""}`)).join("")}

      ${painel("Efeito imediato na turma", tabela(COLS_RANKING, M.ranking.map(r => linhaRanking(r))), {
        nu: true,
        direita: `<span class="tag tag--bom">${M.classes.evolucao} em evolução</span>
                  <span class="tag tag--medio">${M.classes.intermediario} intermediários</span>
                  <span class="tag tag--ruim">${M.classes.atencao} precisam de atenção</span>
                  <span class="tag tag--neutro">${M.alertas.length} alertas</span>`,
      })}`,
    depois() {
      document.querySelectorAll("[data-cfg]").forEach(campo => {
        const evento = campo.type === "range" ? "input" : "change";
        campo.addEventListener(evento, () => {
          const v = parseFloat(campo.value);
          if (Number.isNaN(v)) return;
          CFG[campo.dataset.cfg] = v;
          recalcular(); render();
          const foco = document.getElementById(campo.id);
          if (foco) foco.focus({ preventScroll: true });
        });
      });
      el("restaurar").addEventListener("click", () => { CFG = { ...PADROES }; recalcular(); render(); });
    },
  };
};

/* ===========================================================================
   8. RENDERIZAÇÃO E EVENTOS
   =========================================================================== */
const el = (id) => document.getElementById(id);

function render() {
  // Preserva a rolagem: relançar um resultado não deve tirar o professor do lugar.
  const janela = window.scrollY;
  const gradeAntes = document.querySelector(".grade-res");
  const rolagem = gradeAntes ? { x: gradeAntes.scrollLeft, y: gradeAntes.scrollTop } : null;

  const vista = (VISTAS[rota.vista] || VISTAS.dashboard)();
  el("vista").innerHTML = vista.html;
  montarMenu();
  vista.depois?.();

  const gradeDepois = document.querySelector(".grade-res");
  if (rolagem && gradeDepois) { gradeDepois.scrollLeft = rolagem.x; gradeDepois.scrollTop = rolagem.y; }
  window.scrollTo({ top: janela, behavior: "instant" });
}

document.addEventListener("click", (ev) => {
  const irPara = ev.target.closest("[data-ir]");
  if (irPara) { ir(irPara.dataset.ir); return; }
  const aluno = ev.target.closest("[data-aluno]");
  if (aluno) { ir("aluno", Number(aluno.dataset.aluno)); return; }
  const aula = ev.target.closest("[data-aula]");
  if (aula) { ir("chamada", Number(aula.dataset.aula)); return; }
  const av = ev.target.closest("[data-avaliacao]");
  if (av) { ir("avaliacao", Number(av.dataset.avaliacao)); return; }
});

/* O viewBox dos gráficos acompanha a largura real do container: ao
   redimensionar, redesenha (com folga para não disparar a cada pixel). */
let temporizador;
window.addEventListener("resize", () => {
  clearTimeout(temporizador);
  temporizador = setTimeout(render, 180);
});

recalcular();
render();
</script>
